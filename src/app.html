<title>Eushin's Space Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&family=Nunito:wght@500;700&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one calm night-sky screen; soft paper panels float on it. Home = character + planet journey + game shelf. */
:root {
  color-scheme: light;
  --space: #4B4E6D;
  --space-deep: #3F4260;
  --space-line: #5E6286;
  --mint: #B8F2E6;
  --teal: #4AC7A8;
  --sun: #FFE08A;
  --berry: #FF8C94;
  --paper: #FFFDF6;
  --paper-2: #F4F1E6;
  --ink: #34374F;
  --ink-soft: #6C6F8C;
  --on-space: #F4F3FF;
  --on-space-soft: #C9CBE6;
  --berry-soft: #FFD3D6;
  --teal-soft: #CDEFE6;
  --sun-soft: #FFF1C4;
  --lilac: #DCDDF2;
  --f-display: "Fredoka", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body: "Nunito", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-word: "Andika", "Comic Neue", "Trebuchet MS", system-ui, sans-serif;
  --r-lg: 28px;
  --r-md: 18px;
}
html, body { height: 100%; }
body {
  background: var(--space);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.sky i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--on-space); opacity: .45; }
.sky i.tw { animation: twinkle 7s ease-in-out infinite; }
.sky i.big { width: 5px; height: 5px; background: var(--sun); opacity: .7; }
@keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: .85 } }

#app { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 40px; display: flex; flex-direction: column; gap: 18px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand-ko { font-family: var(--f-display); font-size: 24px; color: var(--on-space); line-height: 1.15; }
.brand-en { font-family: var(--f-word); font-size: 13px; color: var(--on-space-soft); letter-spacing: .06em; }
.top-r { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 14px 6px 8px; font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.pill.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.18) } }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--space-deep); display: grid; place-items: center; color: var(--on-space-soft); border: 2px solid var(--space-line); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.off { opacity: .55; }

/* hero */
.hero { display: flex; align-items: center; gap: 14px; }
.coco-wrap { width: 128px; flex: none; }
.coco { width: 100%; height: auto; display: block; overflow: visible; }
.coco .body-g { transform-origin: 60px 100px; animation: float 4.5s ease-in-out infinite; }
.coco .eyes-happy, .coco .mouth-happy { display: none; }
.coco.happy .eyes-happy, .coco.happy .mouth-happy { display: inline; }
.coco.happy .eyes-open, .coco.happy .mouth-calm { display: none; }
.coco.happy .body-g { animation: hop .55s ease 2; }
.coco.think .body-g { animation: tilt 1.2s ease; }
@keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
@keyframes hop { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-14px) scale(1.03,.97) } }
@keyframes tilt { 30% { transform: rotate(-6deg) } 70% { transform: rotate(4deg) } }

.bubble { position: relative; flex: 1; min-width: 0; background: var(--paper); border-radius: 22px; padding: 14px 18px; font-family: var(--f-display); font-size: 21px; line-height: 1.35; color: var(--ink); text-wrap: balance; }
.bubble::before { content: ""; position: absolute; left: -9px; top: 50%; width: 18px; height: 18px; background: var(--paper); transform: translateY(-50%) rotate(45deg); border-radius: 3px; }
.bubble small { display: block; font-family: var(--f-word); font-size: 15px; color: var(--ink-soft); margin-top: 2px; }

/* journey */
.journey { background: var(--space-deep); border-radius: var(--r-lg); padding: 14px 16px 12px; border: 2px solid var(--space-line); }
.j-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; color: var(--on-space); }
.j-head h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.j-head p { margin: 0; font-size: 14px; color: var(--on-space-soft); }
.track-scroll { overflow-x: auto; margin-top: 10px; padding-bottom: 4px; scrollbar-width: thin; }
.track { position: relative; display: flex; gap: 6px; min-width: 620px; padding: 22px 4px 0; }
.track::before { content: ""; position: absolute; left: 34px; right: 34px; top: 52px; border-top: 3px dashed var(--space-line); }
.stop { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.planet { position: relative; width: 44px; height: 44px; border-radius: 50%; }
.planet.lock { filter: grayscale(.9) brightness(.7); opacity: .55; }
.planet .spot { position: absolute; width: 20%; height: 20%; border-radius: 50%; background: rgba(52, 55, 79, .18); }
.planet .moonlet { position: absolute; right: -14%; top: -8%; width: 26%; height: 26%; border-radius: 50%; background: #FFFDF6; box-shadow: inset -2px -2px 0 rgba(52, 55, 79, .15); }
button.stop { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
button.stop:active .planet { transform: scale(.92); }
.visit-planet { position: relative; padding: 10px 24px; }
.visit-planet .planet { margin: 0 auto; }
.visit-planet .who { position: absolute; right: 0; bottom: -4px; font-size: 54px; animation: float 3s ease-in-out infinite; }
.visit-n { display: inline-flex; align-items: center; gap: 4px; font-size: 15px !important; }
.planet .ring { position: absolute; left: -12px; right: -12px; top: 50%; height: 12px; margin-top: -6px; border-radius: 50%; border: 3px solid var(--sun); transform: rotate(-16deg); opacity: .85; }
.stop .nm { font-family: var(--f-display); font-size: 14px; color: var(--on-space); }
.stop .need { font-size: 12px; color: var(--on-space-soft); display: inline-flex; gap: 3px; align-items: center; font-variant-numeric: tabular-nums; }
.stop .rocket { position: absolute; top: -24px; width: 30px; height: 30px; animation: float 3s ease-in-out infinite; }

/* games */
.sec-title { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 19px; color: var(--on-space); }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.game-card { text-align: left; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); min-height: 132px; transition: transform .15s ease; }
.game-card:hover { transform: translateY(-3px); }
.game-card:active { transform: scale(.97); }
.game-card[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.game-card .mark { width: 52px; height: 52px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-family: var(--f-word); font-weight: 700; font-size: 18px; color: var(--ink); }
.game-card .mark svg { width: 26px; height: 26px; }
.game-card b { font-family: var(--f-display); font-weight: 600; font-size: 20px; }
.game-card span { font-size: 14px; color: var(--ink-soft); margin-top: -6px; }

.shelf { background: var(--paper); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.shelf-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.shelf h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--paper-2); border-radius: 999px; padding: 6px 12px 6px 8px; }
.chip .em { font-size: 20px; line-height: 1; }
.chip .w { font-family: var(--f-word); font-weight: 700; font-size: 17px; }
.chip .ms { display: inline-flex; gap: 1px; }
.sample-note { background: var(--sun-soft); border-radius: 14px; padding: 8px 12px; font-size: 14px; color: var(--ink); }
.sent-list { display: flex; flex-direction: column; gap: 6px; border-top: 2px dashed var(--paper-2); padding-top: 10px; }
.sent-list p { margin: 0; font-family: var(--f-word); font-size: 17px; }
.sent-list p small { font-family: var(--f-body); color: var(--ink-soft); font-size: 14px; margin-left: 6px; }

/* shared buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 22px; border-radius: 999px; font-family: var(--f-display); font-size: 19px; background: var(--teal); color: var(--ink); transition: transform .12s ease; }
.btn:active { transform: scale(.96); }
.btn.sun { background: var(--sun); }
.btn.ghost { background: var(--paper-2); }
.btn.berry { background: var(--berry); }
.btn svg { width: 22px; height: 22px; }
.btn.sm { min-height: 42px; font-size: 16px; padding: 0 16px; }

/* game screen */
.game-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back { font-family: var(--f-display); font-size: 17px; color: var(--on-space); background: var(--space-deep); border: 2px solid var(--space-line); border-radius: 999px; padding: 8px 16px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--space-line); }
.dots i.done { background: var(--sun); }
.dots i.now { background: var(--mint); box-shadow: 0 0 0 3px var(--space-deep), 0 0 0 5px var(--mint); }
.guide { display: flex; align-items: center; gap: 12px; }
.guide .coco-wrap { width: 92px; }
.guide .bubble { font-size: 19px; }

.play { background: var(--paper); border-radius: var(--r-lg); padding: 22px 18px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
.game-name { font-family: var(--f-display); font-size: 15px; color: var(--ink-soft); letter-spacing: .04em; }
.prompt { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pic { font-size: 76px; line-height: 1.1; }
.ko { font-family: var(--f-display); font-size: 24px; color: var(--ink); }
.say-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--teal-soft); border-radius: 999px; padding: 8px 16px; font-family: var(--f-display); font-size: 17px; }
.say-btn svg { width: 20px; height: 20px; }

.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.slot { width: 52px; height: 64px; border-radius: 16px; border: 3px dashed var(--ink-soft); display: grid; place-items: center; font-family: var(--f-word); font-weight: 700; font-size: 40px; color: var(--ink); background: var(--paper); position: relative; }
.slot .ghost { color: var(--ink-soft); opacity: .28; }
.slot.next { border-color: var(--teal); border-style: solid; background: var(--teal-soft); }
.slot.filled { border-style: solid; border-color: var(--teal); background: var(--mint); }
.slot.filled .ghost { display: none; }
.slot.pop { animation: pop .35s ease; }
.gap { width: 18px; font-family: var(--f-word); font-size: 40px; display: grid; place-items: end center; height: 64px; color: var(--ink); }
@keyframes pop { 50% { transform: scale(1.15) } }

.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 520px; }
.tile { width: 62px; height: 62px; border-radius: 18px; background: var(--sun); font-family: var(--f-word); font-weight: 700; font-size: 34px; color: var(--ink); box-shadow: 0 4px 0 #E2C46D; transition: transform .12s ease, opacity .2s; }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 #E2C46D; }
.tile.used { opacity: 0; pointer-events: none; transform: scale(.6); }
.tile.hint { box-shadow: 0 0 0 4px var(--teal), 0 4px 0 #E2C46D; }
.shake { animation: shake .4s ease; }
@keyframes shake { 20%,60% { transform: translateX(-6px) } 40%,80% { transform: translateX(6px) } }

.word-big { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; font-family: var(--f-word); font-weight: 700; font-size: 54px; color: var(--ink); line-height: 1.1; }
.word-big .lt { display: inline-block; padding: 0 2px; border-radius: 10px; transition: background .2s; }
.word-big .lt.on { background: var(--sun); }
.word-big .hole { width: 56px; height: 66px; border: 3px dashed var(--teal); border-radius: 16px; display: grid; place-items: center; background: var(--teal-soft); }
.word-big .hole.filled { border-style: solid; background: var(--mint); }

.opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.opt-star { width: 84px; height: 84px; position: relative; display: grid; place-items: center; font-family: var(--f-word); font-weight: 700; font-size: 34px; color: var(--ink); transition: transform .12s; }
.opt-star svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.opt-star span { position: relative; margin-top: 6px; }
.opt-star:active { transform: scale(.94); }
.opt-star.dim { opacity: .35; }

.pick-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 560px; }
.pick { background: var(--paper-2); border-radius: 22px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 3px solid transparent; transition: transform .12s; }
.pick .pe { font-size: 52px; line-height: 1.1; }
.pick .pw { font-family: var(--f-word); font-weight: 700; font-size: 20px; overflow-wrap: anywhere; }
.pick.right { border-color: var(--teal); background: var(--mint); }
.pick.dim { opacity: .35; }
.pick:active { transform: scale(.96); }

.listen-big { width: 120px; height: 120px; border-radius: 50%; background: var(--teal-soft); display: grid; place-items: center; border: 4px solid var(--teal); }
.listen-big svg { width: 54px; height: 54px; }

.learn-word { font-family: var(--f-word); font-weight: 700; font-size: 64px; line-height: 1.1; }
.learn-nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.sentence { font-family: var(--f-word); font-size: 30px; line-height: 1.5; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; max-width: 640px; }
.sentence .tk { border-radius: 10px; padding: 0 4px; transition: background .2s; }
.sentence .tk.on { background: var(--sun); }
.sentence .blank { display: inline-block; min-width: 90px; border-bottom: 4px dashed var(--teal); color: var(--ink); }
.sentence .blank.filled { border-bottom-style: solid; background: var(--mint); border-radius: 8px 8px 0 0; }
.ko-line { font-size: 18px; color: var(--ink-soft); margin-top: -10px; }
.build-line { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 60px; max-width: 640px; }
.build-line .ph { min-width: 64px; height: 52px; border-radius: 14px; border: 3px dashed var(--ink-soft); opacity: .45; }
.build-line .placed { height: 52px; padding: 0 14px; border-radius: 14px; background: var(--mint); border: 3px solid var(--teal); font-family: var(--f-word); font-weight: 700; font-size: 24px; display: grid; place-items: center; animation: pop .3s ease; }
.blocks { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 640px; }
.blk { height: 54px; padding: 0 16px; border-radius: 14px; background: var(--sun); font-family: var(--f-word); font-weight: 700; font-size: 24px; box-shadow: 0 4px 0 #E2C46D; }
.blk.used { visibility: hidden; }
.blk.hint { box-shadow: 0 0 0 4px var(--teal), 0 4px 0 #E2C46D; }
.step-tag { display: inline-flex; gap: 6px; }
.step-tag i { font-style: normal; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--paper-2); color: var(--ink-soft); }
.step-tag i.on { background: var(--sun); color: var(--ink); }

.next-row { min-height: 54px; display: flex; justify-content: center; }

/* fly star */
.fly { position: fixed; z-index: 50; width: 36px; height: 36px; pointer-events: none; }

/* modal */
.modal-back { position: fixed; inset: 0; z-index: 40; background: rgba(52, 55, 79, .6); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--paper); border-radius: var(--r-lg); padding: 24px 20px; width: min(420px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; animation: rise .4s ease; }
.modal h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 28px; }
.modal p { margin: 0; font-size: 17px; color: var(--ink-soft); }
.modal .coco-wrap { width: 120px; }
.earned { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.new-planet { display: flex; align-items: center; gap: 12px; background: var(--sun-soft); border-radius: 18px; padding: 10px 16px; font-family: var(--f-display); font-size: 18px; }
.modal-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
@keyframes rise { from { transform: translateY(20px); opacity: .4 } }

/* parent */
.parent { background: var(--paper); border-radius: var(--r-lg); padding: 20px 16px; display: flex; flex-direction: column; gap: 18px; }
.parent h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 24px; }
.parent h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 19px; }
.parent p.help { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.5; }
.gate { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.gate-q { font-family: var(--f-display); font-size: 26px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field { border: 2px solid var(--paper-2); background: var(--paper); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; color: var(--ink); width: 100%; min-width: 0; }
.field:focus { border-color: var(--teal); outline: none; }
.field.word { font-family: var(--f-word); font-size: 18px; }
.gate .field { width: 110px; font-size: 22px; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row-head, .wrow { display: grid; grid-template-columns: 26px 54px minmax(0, 1.2fr) minmax(0, 1fr) 36px; gap: 8px; align-items: center; }
.row-head { font-size: 13px; color: var(--ink-soft); padding: 0 2px; }
.wrow .num { font-size: 14px; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
.wrow .field.em { text-align: center; font-size: 22px; padding: 6px 4px; }
.x-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--paper-2); color: var(--ink-soft); font-size: 20px; line-height: 1; }
.srow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 8px; }
.p-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; background: var(--paper-2); border-radius: 999px; padding: 4px; gap: 4px; align-self: flex-start; }
.seg-btn { min-height: 44px; padding: 0 22px; border-radius: 999px; font-family: var(--f-display); font-size: 18px; color: var(--ink-soft); }
.seg-btn.on { background: var(--teal); color: var(--ink); }
.danger-zone { border-top: 2px dashed var(--paper-2); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.err { color: #B4434C; font-size: 15px; margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 12px 20px; font-family: var(--f-display); font-size: 16px; max-width: calc(100% - 32px); text-align: center; }

.empty { background: var(--paper); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 20px; }
.empty p { margin: 0; color: var(--ink-soft); line-height: 1.5; }

/* new games */
.mem-grid { display: grid; gap: 14px; width: 100%; max-width: 620px; }
.mem-card { position: relative; aspect-ratio: 4 / 3; border-radius: 22px; background: var(--space-deep); border: 3px solid var(--space-line); display: grid; place-items: center; transition: transform .15s, background .2s; }
.mem-card .mc-back { width: 56px; height: 56px; }
.mem-card .mc-back svg { width: 100%; height: 100%; display: block; }
.game-card .mark.emo { font-size: 28px; }
.mem-card .mc-face { display: none; }
.mem-card.open { background: var(--paper-2); border-color: var(--paper-2); }
.mem-card.open .mc-back { display: none; }
.mem-card.open .mc-face { display: block; }
.mem-card.match { background: var(--mint); border-color: var(--teal); }
.mc-pic { font-size: 54px; line-height: 1; }
.mc-word { font-family: var(--f-word); font-weight: 700; font-size: 30px; color: var(--ink); overflow-wrap: anywhere; }
.meteors { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.meteor { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 999px; background: var(--paper-2); border: 3px solid transparent; font-family: var(--f-word); font-size: 32px; color: var(--ink); animation: drift 3s ease-in-out infinite; }
.meteor span { font-size: 28px; }

  /* meteor: pick the right spelling */
  function misspell(word, avoid) {
    const out = new Set(), V = 'aeiou', C = 'bcdfghklmnprstvwz';
    const ch = [...word], li = ch.map((c, k) => isLetter(c) ? k : -1).filter(k => k >= 0);
    for (let n = 0; out.size < 2 && n < 60; n++) {
      const a = ch.slice(), k = rnd(li), t = n % 4;
      if (t === 0 && li.length > 1) { const j = li[li.indexOf(k) + 1]; if (j === undefined || a[k] === a[j]) continue; [a[k], a[j]] = [a[j], a[k]]; }
      else if (t === 1) { const pool = (V.includes(a[k]) ? V : C).replace(a[k], ''); a[k] = rnd([...pool]); }
      else if (t === 2 && li.length > 2) a.splice(k, 1);
      else a.splice(k, 0, a[k]);
      const v = a.join('');
      if (v !== word && !avoid.includes(v)) out.add(v);
    }
    return [...out];
  }
  function renderMeteor() {
    const w = g.queue[g.i];
    const opts = shuffle([w.en, ...misspell(w.en, state.week.words.map(x => x.en))]);

    play().innerHTML = `

    say('Which meteor is spelled right?', 'Look at every letter.');

  function renderTrace() {

    say('Trace the gray letters.', 'Go slowly, one letter at a time.');

  async function setupPad(color) {
    try { await document.fonts.load('700 120px Andika'); } catch {}
    const wrap = document.getElementById('pad'); if (!wrap || !g || g.type !== 'trace') return;
    const gc = document.getElementById('guideC'), ic = document.getElementById('inkC');
    pad = { wrap, gc, ic, gctx: gc.getContext('2d'), ictx: ic.getContext('2d'), color, pencil: false, active: null, W: 0, H: 0 };
    layoutPad();
    if (window.ResizeObserver) new ResizeObserver(() => { if (pad && pad.wrap === wrap) layoutPad(); }).observe(wrap);
    ic.addEventListener('pointerdown', padDown);
    ic.addEventListener('pointermove', padMove);
    ic.addEventListener('pointerup', padUp);
    ic.addEventListener('pointercancel', padUp);
    ic.addEventListener('touchstart', e => { if (e.touches.length === 1) e.preventDefault(); }, { passive: false });
  }
  function layoutPad() {
    const r = pad.wrap.getBoundingClientRect();
    const W = Math.round(r.width), H = Math.round(r.height);
    if (!W || !H || (W === pad.W && H === pad.H)) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    pad.W = W; pad.H = H; pad.dpr = dpr;
    for (const c of [pad.gc, pad.ic]) { c.width = W * dpr; c.height = H * dpr; }
    pad.gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pad.ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const word = g.queue[g.i].en, ctx = pad.gctx;
    ctx.font = '700 100px Andika, "Trebuchet MS", sans-serif';
    const fs = Math.max(40, Math.min(H * 0.5, (W - 56) / ctx.measureText(word).width * 100));
    pad.font = `700 ${fs}px Andika, "Trebuchet MS", sans-serif`; pad.fs = fs;
    ctx.font = pad.font;
    const asc = ctx.measureText('h').actualBoundingBoxAscent || fs * .72;
    const xh = ctx.measureText('x').actualBoundingBoxAscent || fs * .5;
    const desc = ctx.measureText('g').actualBoundingBoxDescent || fs * .22;
    const tw = ctx.measureText(word).width;
    pad.base = Math.round((H - asc - desc) / 2 + asc);
    pad.asc = asc; pad.xh = xh; pad.desc = desc;
    pad.x0 = (W - tw) / 2;
    pad.letters = [...word].map((ch, k) => {
      const a = pad.x0 + ctx.measureText(word.slice(0, k)).width, b = pad.x0 + ctx.measureText(word.slice(0, k + 1)).width;
      return { ch, x0: a, x1: b, done: !isLetter(ch), pts: [] };

- "emoji": one emoji that pictures the word, or "" if none fits
For each sentence give "en" exactly as written (normal capitalization and punctuation) and "ko" a short natural Korean translation.
Ignore titles, instructions, page numbers, names, dates and alphabet practice rows. Do not add words that are not on the page. At most 20 words.
Reply with only JSON in this shape:
{"words":[{"en":"apple","ko":"사과","emoji":"🍎"}],"sentences":[{"en":"I like apples.","ko":"나는 사과를 좋아해요."}]}
If no English words are visible, reply {"words":[],"sentences":[]}.`;
  const SCAN_ERR = {
    not_granted: 'Photo reading wasn\'t allowed. Please type the words instead.',
    cancelled: 'Stopped reading the photo.',
    rate_limited: 'Too many tries at once. Wait a minute, then try again.',
    invalid_json: 'The words couldn\'t be sorted out. Retake the photo with the words clearly visible.',
    image_rejected: 'This photo can\'t be read. Please use a different one.',
  };
  async function runScan(file) {
    if (!file || !sampleFn || scan.status === 'busy') return;
    scan = { status: 'busy', source: 'photo', thumb: '', words: [], sentences: [], msg: '', ctl: new AbortController() };
    refreshScan();
    try {
      let shot = await shrinkImage(file, 1800, .85);
      if (sampleImages.maxBytes && shot.blob.size > sampleImages.maxBytes) shot = await shrinkImage(file, 1200, .7);
      scan.thumb = shot.thumb; refreshScan();
      const res = await sampleFn.json(SCAN_PROMPT, { images: [shot.blob], signal: scan.ctl.signal });
      const w = normWeek({ words: res && res.words, sentences: res && res.sentences }) || { words: [], sentences: [] };
      const seen = new Set();
      scan.words = w.words.filter(x => /^[a-z][a-z '\-]*$/.test(x.en) && !seen.has(x.en) && seen.add(x.en)).slice(0, 20)
        .map(x => ({ ...x, emoji: x.emoji || EMOJI[x.en] || '' }));
      scan.sentences = w.sentences.slice(0, 2);
      scan.status = 'done';
    } catch (e) {
      scan.status = 'error';
      scan.msg = (e && SCAN_ERR[e.code]) || 'The photo couldn\'t be read. Please try again.';
    }
    scan.ctl = null;
    refreshScan();
  }
  function applyScan(replace) {
    const words = scan.words.filter((_, i) => { const c = document.getElementById('scw-' + i); return c && c.checked; });
    const sents = scan.sentences.filter((_, i) => { const c = document.getElementById('scs-' + i); return c && c.checked; });
    const rowsEl = document.getElementById('rows');
    if (replace) {
      rowsEl.querySelectorAll('.wrow input').forEach(i => { i.value = ''; delete i.dataset.auto; });
      if (sents.length) [0, 1].forEach(i => { document.getElementById('s-en-' + i).value = ''; document.getElementById('s-ko-' + i).value = ''; });
    }
    let added = 0, skipped = 0;
    const existing = new Set([...rowsEl.querySelectorAll('[id^="w-en-"]')].map(i => i.value.trim().toLowerCase()).filter(Boolean));
    for (const w of words) {
      if (existing.has(w.en)) continue;
      let empty = [...rowsEl.querySelectorAll('[id^="w-en-"]')].find(i => !i.value.trim());
      if (!empty) {
        const n = rowsEl.querySelectorAll('.wrow').length;
        if (n >= 20) { skipped++; continue; }
        rowsEl.insertAdjacentHTML('beforeend', wordRow(n));
        empty = document.getElementById('w-en-' + n);
      }
      const k = empty.id.slice(5);
      empty.value = w.en;
      document.getElementById('w-ko-' + k).value = w.ko;
      document.getElementById('w-em-' + k).value = w.emoji;
      existing.add(w.en); added++;
    }
    let sAdded = 0;
    for (const s of sents) {
      const slot = [0, 1].find(i => !document.getElementById('s-en-' + i).value.trim());
      if (slot === undefined) break;
      document.getElementById('s-en-' + slot).value = s.en;
      document.getElementById('s-ko-' + slot).value = s.ko;
      sAdded++;
    }
    scan = { status: 'idle', thumb: '', words: [], sentences: [], msg: '', ctl: null };
    const pi = document.getElementById('pasteIn'); if (pi) pi.value = '';
    refreshScan();
    toast(`Added ${added} words${sAdded ? ` and ${sAdded} sentences` : ''}.${skipped ? ` ${skipped} left out (20 max).` : ''} Check them, then save.`);
  }
  function markName() {
    document.querySelectorAll('.seg-btn').forEach(x => { const on = x.dataset.name === state.name; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  }
  async function setName(n) {
    if (!NAMES.includes(n)) return;
    state.name = n; lsSet(LS_NAME, n); markName(); sfx.tap();
    if (state.db) { try { await state.db.doc('study/settings').set({ name: n }); } catch {} }
    toast(`Name set to ${n}`);
  }
  function collectWeek() {
    const words = [];
    document.querySelectorAll('#rows .wrow').forEach(r => {
      const [em, en, ko] = r.querySelectorAll('input');
      const e = en.value.trim().toLowerCase().replace(/\s+/g, ' ');
      if (!e) return;
      words.push({ en: e, ko: ko.value.trim(), emoji: em.value.trim() || EMOJI[e] || '' });
    });
    const sentences = [0, 1].map(i => ({ en: document.getElementById('s-en-' + i).value.trim().replace(/\s+/g, ' '), ko: document.getElementById('s-ko-' + i).value.trim() })).filter(s => s.en);
    return { words, sentences };
  }

  /* ---------- events ---------- */
  const app = document.getElementById('app');
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    ac();
    const act = b.dataset.act;
    switch (act) {
      case 'visit': visitPlanet(Number(b.dataset.i)); break;
      case 'home': closeModal(); sfx.tap(); renderHome(); window.scrollTo(0, 0); break;
      case 'play': sfx.tap(); startGame(b.dataset.game); window.scrollTo(0, 0); break;
      case 'again': closeModal(); startGame(b.dataset.game); window.scrollTo(0, 0); break;
      case 'sound':
        state.sound = !state.sound; lsSet(LS_SOUND, state.sound);
        b.classList.toggle('off', !state.sound); b.innerHTML = noteSVG(state.sound);
        b.setAttribute('aria-label', state.sound ? 'Turn sound effects off' : 'Turn sound effects on');
        if (state.sound) sfx.pop();
        break;
      case 'parent': sfx.tap(); renderParentGate(); setTimeout(() => { const i = document.getElementById('gateIn'); if (i) i.focus(); }, 50); break;
      case 'try-example': saveWeek(normWeek(EXAMPLE)); renderHome(); break;
      case 'say-word': if (g) speak(g.queue[g.i].en); break;
      case 'spell-slow': if (g) spellSlow(g.queue[g.i].en, highlightLetter); break;
      case 'next': nextRound(); window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); break;
      case 'prev': if (g && g.i > 0) { sfx.tap(); g.i--; renderRound(); } break;
      case 'learn-done': award(1, b); g.i = g.queue.length; setTimeout(finishGame, 700); break;
      case 'tile': tapTile(b); break;
      case 'opt': tapOpt(b); break;
      case 'pick': tapPick(b); break;
      case 'mem': tapMem(b); break;
      case 'met': tapMeteor(b); break;
      case 'mean': tapMeaning(b); break;
      case 'catch': tapCatch(b); break;
      case 'say-sent': if (g) speakSentence(false); break;
      case 'say-sent-slow': if (g) speakSentence(true); break;
      case 'phase': sfx.tap(); g.phase = b.dataset.to; renderSentence(); break;
      case 'blk': tapBlock(b); break;
      case 'sopt': tapSentOpt(b); break;
      case 'ink': if (pad) { pad.color = b.dataset.c; document.querySelectorAll('.swatch').forEach(x => x.classList.toggle('on', x === b)); sfx.tap(); } break;
      case 'trace-clear': if (pad && !g.done) { pad.ictx.clearRect(0, 0, pad.W, pad.H); sfx.tap(); } break;
      case 'trace-check': if (g.phase === 'trace') checkTrace(true); else checkFree(); break;
      case 'trace-free': startFreeWrite(); break;
      case 'set-name': setName(b.dataset.name); break;
      case 'row-add': {
        const rows = document.getElementById('rows');
        const n = rows.querySelectorAll('.wrow').length;
        if (n >= 20) { toast('You can add up to 20 words'); break; }
        rows.insertAdjacentHTML('beforeend', wordRow(n));
        document.getElementById('w-en-' + n).focus();
        break;
      }
      case 'row-del': b.closest('.wrow').querySelectorAll('input').forEach(i => { i.value = ''; delete i.dataset.auto; }); break;
      case 'scan-stop': if (scan.ctl) scan.ctl.abort(); break;
      case 'paste-read': readPasted(); break;
      case 'scan-add': applyScan(false); break;
      case 'scan-replace': applyScan(true); break;
      case 'fill-example': renderParent(normWeek(EXAMPLE)); toast('Example words filled in. Tap Save words to use them.'); break;
      case 'reset-ask':
        document.getElementById('resetBox').innerHTML = `<p class="help">All ${state.progress.stars} stars and word progress go back to 0. This can't be undone.</p>
          <div class="p-actions"><button type="button" class="btn berry sm" data-act="reset-do">Reset to 0</button><button type="button" class="btn ghost sm" data-act="reset-no">Cancel</button></div>`;
        break;
      case 'reset-no': document.getElementById('resetBox').innerHTML = `<button type="button" class="btn ghost sm" data-act="reset-ask">Start stars over</button>`; break;
      case 'reset-do':
        state.progress = { stars: 0, mastery: {} }; saveProgress(); updatePill();
        document.getElementById('resetBox').innerHTML = `<p class="help">Stars reset to 0.</p>`;
        break;
    }
  });
  document.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (e.target.id === 'gateForm') {
      const v = Number(document.getElementById('gateIn').value);
      if (v === gateAns) renderParent();
      else document.getElementById('gateErr').hidden = false;
    } else if (e.target.id === 'weekForm') {
      const err = document.getElementById('saveErr');
      const { words, sentences } = collectWeek();
      const bad = words.find(w => !/^[a-z][a-z '\-]*$/.test(w.en));
      if (!words.length) { err.textContent = 'Please enter at least one word.'; err.hidden = false; return; }
      if (bad) { err.textContent = `Please use English letters only in "${bad.en}".`; err.hidden = false; return; }
      if (words.length < 3) { err.textContent = 'Sound Hunt needs at least 3 words.'; err.hidden = false; return; }
      err.hidden = true;
      const res = await saveWeek({ words, sentences, sample: false });
      if (res === 'denied') toast('You can\'t save to the shared list here. Saved on this device only.');
      else if (res === 'failed') toast('Couldn\'t save online. Saved on this device.');
      else toast(`Saved ${words.length} words!`);
      renderHome(); window.scrollTo(0, 0);
    }
  });
  document.addEventListener('input', (e) => {
    const m = e.target.id && e.target.id.match(/^w-en-(\d+)$/);
    if (m) {
      const em = document.getElementById('w-em-' + m[1]);
      const hit = EMOJI[e.target.value.trim().toLowerCase()];
      if (em && (!em.value || em.dataset.auto === '1')) { em.value = hit || ''; if (hit) em.dataset.auto = '1'; else delete em.dataset.auto; }
    } else if (e.target.id && e.target.id.startsWith('w-em-')) {
      delete e.target.dataset.auto;
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'camIn' || e.target.id === 'picIn') {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      runScan(f);
    }
  });

  renderHome();
  connect();
  connectSample();
})();
</script>

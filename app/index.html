<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4B4E6D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spelly">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<style>
html { background: #4B4E6D; }
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<script src="../config.js"></script>
<title>Eushin's Space Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&family=Nunito:wght@500;700&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one calm themed sky; soft paper panels float on it. Home = guide character + place journey + game shelf.
   Colors are CSS variables set per theme by THEMES in the script; the same components serve every theme. */
:root {
  color-scheme: light;
  /* colors come from THEMES in the script ([data-theme] blocks) */
  --f-display: "Fredoka", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body: "Nunito", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-word: "Andika", "Comic Neue", "Trebuchet MS", system-ui, sans-serif;
  --r-lg: 28px;
  --r-md: 18px;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* themed background layer: gradient + quiet decorations at the edges, never over the panels' text or buttons */
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; background: var(--bg-grad, var(--bg)); }
.sky i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--on-bg); opacity: .45; }
.sky i.tw { animation: twinkle 7s ease-in-out infinite; }
.sky i.big { width: 5px; height: 5px; background: var(--accent); opacity: .7; }
.sky i.sp { width: 12px; height: 12px; border-radius: 0; background: var(--sparkle, var(--accent)); opacity: .6; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
.sky i.sp.big { width: 18px; height: 18px; }
.sky i.blink { width: 6px; height: 6px; border-radius: 2px; background: var(--primary); opacity: .5; animation: twinkle 3.5s ease-in-out infinite; }
.sky .deco { position: absolute; display: block; }
.sky .spin { animation: spin 80s linear infinite; }
.sky .drift { animation: drift-x 40s ease-in-out infinite alternate; }
@keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: .85 } }
@keyframes drift-x { from { transform: translateX(-24px) } to { transform: translateX(24px) } }

#app { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 40px; display: flex; flex-direction: column; gap: 18px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand-ko { font-family: var(--f-display); font-size: 24px; color: var(--on-bg); line-height: 1.15; }
.brand-en { font-family: var(--f-word); font-size: 13px; color: var(--on-bg-soft); letter-spacing: .06em; }
.top-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 14px 6px 8px; font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.pill.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.18) } }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-deep); display: grid; place-items: center; color: var(--on-bg-soft); border: 2px solid var(--bg-line); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.off { opacity: .55; }

/* hero */
.hero { display: flex; align-items: center; gap: 14px; }
.coco-wrap { width: 128px; flex: none; }
.hero-art { position: relative; flex: none; width: 128px; display: grid; place-items: end center; }
.hero-art .coco-wrap { position: relative; width: 112px; }
.hero-bg { position: absolute; inset: 14% 0 0; border-radius: 50%; overflow: hidden; border: 3px solid var(--bg-line); }
.hero-bg svg, .scene { width: 100%; height: 100%; display: block; }
.coco { width: 100%; height: auto; display: block; overflow: visible; }
.coco .body-g { transform-origin: 60px 100px; animation: float 4.5s ease-in-out infinite; }
.coco .eyes-happy, .coco .mouth-happy { display: none; }
.coco.happy .eyes-happy, .coco.happy .mouth-happy { display: inline; }
.coco.happy .eyes-open, .coco.happy .mouth-calm { display: none; }
.coco.happy .body-g { animation: hop .55s ease 2; }
.coco.think .body-g { animation: tilt 1.2s ease; }
@keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
@keyframes hop { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-14px) scale(1.03,.97) } }
@keyframes tilt { 30% { transform: rotate(-6deg) } 70% { transform: rotate(4deg) } }

.bubble { position: relative; flex: 1; min-width: 0; background: var(--paper); border-radius: 22px; padding: 14px 18px; font-family: var(--f-display); font-size: 21px; line-height: 1.35; color: var(--ink); text-wrap: balance; }
.bubble::before { content: ""; position: absolute; left: -9px; top: 50%; width: 18px; height: 18px; background: var(--paper); transform: translateY(-50%) rotate(45deg); border-radius: 3px; }
.bubble small { display: block; font-family: var(--f-word); font-size: 15px; color: var(--ink-soft); margin-top: 2px; }

/* journey */
.journey { background: var(--bg-deep); border-radius: var(--r-lg); padding: 14px 16px 12px; border: 2px solid var(--bg-line); }
.j-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; color: var(--on-bg); }
.j-head h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.j-head p { margin: 0; font-size: 14px; color: var(--on-bg-soft); }
.track-scroll { overflow-x: auto; margin-top: 10px; padding-bottom: 4px; scrollbar-width: thin; }
.track { position: relative; display: flex; gap: 6px; min-width: 620px; padding: 22px 4px 0; }
.track::before { content: ""; position: absolute; left: 34px; right: 34px; top: 52px; border-top: 3px dashed var(--bg-line); }
.stop { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.planet { position: relative; width: 44px; height: 44px; border-radius: 50%; }
.planet.lock { filter: grayscale(.9) brightness(.7); opacity: .55; }
.planet.place { border-radius: 0; }
.planet.place svg { width: 100%; height: 100%; display: block; overflow: visible; }
.planet .spot { position: absolute; width: 20%; height: 20%; border-radius: 50%; background: rgba(52, 55, 79, .18); }
.planet .moonlet { position: absolute; right: -14%; top: -8%; width: 26%; height: 26%; border-radius: 50%; background: #FFFDF6; box-shadow: inset -2px -2px 0 rgba(52, 55, 79, .15); }
button.stop { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
button.stop:active .planet { transform: scale(.92); }
.visit-planet { position: relative; padding: 10px 24px; }
.visit-planet .planet { margin: 0 auto; }
.visit-planet .who { position: absolute; right: 0; bottom: -4px; font-size: 54px; animation: float 3s ease-in-out infinite; }
.visit-n { display: inline-flex; align-items: center; gap: 4px; font-size: 15px !important; }
.planet .ring { position: absolute; left: -12px; right: -12px; top: 50%; height: 12px; margin-top: -6px; border-radius: 50%; border: 3px solid var(--accent); transform: rotate(-16deg); opacity: .85; }
.stop .nm { font-family: var(--f-display); font-size: 14px; color: var(--on-bg); }
.stop .need { font-size: 12px; color: var(--on-bg-soft); display: inline-flex; gap: 3px; align-items: center; font-variant-numeric: tabular-nums; }
.stop .rocket { position: absolute; top: -24px; width: 30px; height: 30px; animation: float 3s ease-in-out infinite; }
.stop .rocket svg, .mem-card .mc-back svg { width: 100%; height: 100%; display: block; }
.stop.here .nm { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; text-decoration-color: var(--accent); }

/* games */
.sec-title { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 19px; color: var(--on-bg); }
/* 16 games in a 4 x 4 grid (2 columns on narrow phones); mark beside the title keeps cards short */
.games { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 599px) { .games { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.game-card { text-align: left; border-radius: 20px; padding: 12px; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 10px; color: var(--ink); min-height: 104px; transition: transform .15s ease; }
.game-card > span:last-child { grid-column: 1 / -1; }
.game-card:hover { transform: translateY(-3px); }
.game-card:active { transform: scale(.97); }
.game-card[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.game-card .mark { width: 42px; height: 42px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-family: var(--f-word); font-weight: 700; font-size: 18px; color: var(--ink); }
.game-card .mark svg { width: 22px; height: 22px; }
.game-card b { font-family: var(--f-display); font-weight: 600; font-size: 18px; line-height: 1.15; }
.game-card span { font-size: 13px; color: var(--ink-soft); line-height: 1.3; }

.shelf { background: var(--paper); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.shelf-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.shelf h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--paper-2); border-radius: 999px; padding: 6px 12px 6px 8px; }
.chip .em { font-size: 20px; line-height: 1; }
.chip .w { font-family: var(--f-word); font-weight: 700; font-size: 17px; }
.chip .ms { display: inline-flex; gap: 1px; }
.sample-note { background: var(--accent-soft); border-radius: 14px; padding: 8px 12px; font-size: 14px; color: var(--ink); }
.sent-list { display: flex; flex-direction: column; gap: 6px; border-top: 2px dashed var(--paper-2); padding-top: 10px; }
.sent-list p { margin: 0; font-family: var(--f-word); font-size: 17px; }
.sent-list p small { font-family: var(--f-body); color: var(--ink-soft); font-size: 14px; margin-left: 6px; }

/* shared buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 22px; border-radius: 999px; font-family: var(--f-display); font-size: 19px; background: var(--primary); color: var(--ink); transition: transform .12s ease; }
.btn:active { transform: scale(.96); }
.btn.sun { background: var(--accent); }
.btn.ghost { background: var(--paper-2); }
.btn.berry { background: var(--warm); }
.btn svg { width: 22px; height: 22px; }
.btn.sm { min-height: 42px; font-size: 16px; padding: 0 16px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

/* game screen */
.game-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back { font-family: var(--f-display); font-size: 17px; color: var(--on-bg); background: var(--bg-deep); border: 2px solid var(--bg-line); border-radius: 999px; padding: 8px 16px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--bg-line); display: grid; place-items: center; }
.dots i.done { background: none; width: 20px; height: 20px; }   /* done = reward shape, not just a color */
.dots i.done svg { width: 100%; height: 100%; display: block; }
.dots i.now { background: var(--success); box-shadow: 0 0 0 3px var(--bg-deep), 0 0 0 5px var(--success); }
.guide { display: flex; align-items: center; gap: 12px; }
.guide .coco-wrap { width: 92px; }
.guide .bubble { font-size: 19px; }

.play { background: var(--paper); border-radius: var(--r-lg); padding: 22px 18px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
.game-name { font-family: var(--f-display); font-size: 15px; color: var(--ink-soft); letter-spacing: .04em; }
.prompt { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pic { font-size: 76px; line-height: 1.1; }
.ko { font-family: var(--f-display); font-size: 24px; color: var(--ink); }
.say-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--primary-soft); border-radius: 999px; padding: 8px 16px; font-family: var(--f-display); font-size: 17px; }
.say-btn svg { width: 20px; height: 20px; }

.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.slot { width: 52px; height: 64px; border-radius: 16px; border: 3px dashed var(--ink-soft); display: grid; place-items: center; font-family: var(--f-word); font-weight: 700; font-size: 40px; color: var(--ink); background: var(--paper); position: relative; }
.slot .ghost { color: var(--ink-soft); opacity: .28; }
.slot.next { border-color: var(--primary); border-style: solid; background: var(--primary-soft); }
.slot.filled { border-style: solid; border-color: var(--primary); background: var(--success); }
.slot.filled .ghost { display: none; }
.slot.pop { animation: pop .35s ease; }
.gap { width: 18px; font-family: var(--f-word); font-size: 40px; display: grid; place-items: end center; height: 64px; color: var(--ink); }
@keyframes pop { 50% { transform: scale(1.15) } }

.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 520px; }
.tile { width: 62px; height: 62px; border-radius: 18px; background: var(--accent); font-family: var(--f-word); font-weight: 700; font-size: 34px; color: var(--ink); box-shadow: 0 4px 0 var(--accent-shadow); transition: transform .12s ease, opacity .2s; }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-shadow); }
.tile.used { opacity: 0; pointer-events: none; transform: scale(.6); }
.tile.hint { box-shadow: 0 0 0 4px var(--primary), 0 4px 0 var(--accent-shadow); }
.shake { animation: shake .4s ease; }
@keyframes shake { 20%,60% { transform: translateX(-6px) } 40%,80% { transform: translateX(6px) } }

.word-big { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; font-family: var(--f-word); font-weight: 700; font-size: 54px; color: var(--ink); line-height: 1.1; }
.word-big .lt { display: inline-block; padding: 0 2px; border-radius: 10px; transition: background .2s; }
.word-big .lt.on { background: var(--accent); }
.word-big .hole { width: 56px; height: 66px; border: 3px dashed var(--primary); border-radius: 16px; display: grid; place-items: center; background: var(--primary-soft); }
.word-big .hole.filled { border-style: solid; background: var(--success); }

.opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.opt-star { width: 84px; height: 84px; position: relative; display: grid; place-items: center; font-family: var(--f-word); font-weight: 700; font-size: 34px; color: var(--ink); transition: transform .12s; }
.opt-star svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.opt-star span { position: relative; margin-top: var(--opt-dy, 0px); }
.opt-star:active { transform: scale(.94); }
.opt-star.dim { opacity: .35; }

.pick-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 560px; }
.pick { position: relative; background: var(--paper-2); border-radius: 22px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 3px solid transparent; transition: transform .12s; }
.pick .pe { font-size: 52px; line-height: 1.1; }
.pick .pw { font-family: var(--f-word); font-weight: 700; font-size: 20px; overflow-wrap: anywhere; }
.pick.right { border-color: var(--primary); background: var(--success); }
.pick.dim { opacity: .35; }
.pick:active { transform: scale(.96); }

.listen-big { width: 120px; height: 120px; border-radius: 50%; background: var(--primary-soft); display: grid; place-items: center; border: 4px solid var(--primary); }
.listen-big svg { width: 54px; height: 54px; }

.learn-word { font-family: var(--f-word); font-weight: 700; font-size: 64px; line-height: 1.1; }
.learn-nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.sentence { font-family: var(--f-word); font-size: 30px; line-height: 1.5; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; max-width: 640px; }
.sentence .tk { border-radius: 10px; padding: 0 4px; transition: background .2s; }
.sentence .tk.on { background: var(--accent); }
.sentence .blank { display: inline-block; min-width: 90px; border-bottom: 4px dashed var(--primary); color: var(--ink); }
.sentence .blank.filled { border-bottom-style: solid; background: var(--success); border-radius: 8px 8px 0 0; }
.ko-line { font-size: 18px; color: var(--ink-soft); margin-top: -10px; }
.build-line { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 60px; max-width: 640px; }
.build-line .ph { min-width: 64px; height: 52px; border-radius: 14px; border: 3px dashed var(--ink-soft); opacity: .45; }
.build-line .placed { height: 52px; padding: 0 14px; border-radius: 14px; background: var(--success); border: 3px solid var(--primary); font-family: var(--f-word); font-weight: 700; font-size: 24px; display: grid; place-items: center; animation: pop .3s ease; }
.blocks { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 640px; }
.blk { height: 54px; padding: 0 16px; border-radius: 14px; background: var(--accent); font-family: var(--f-word); font-weight: 700; font-size: 24px; box-shadow: 0 4px 0 var(--accent-shadow); }
.blk.used { visibility: hidden; }
.blk.hint { box-shadow: 0 0 0 4px var(--primary), 0 4px 0 var(--accent-shadow); }
.step-tag { display: inline-flex; gap: 6px; }
.step-tag i { font-style: normal; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--paper-2); color: var(--ink-soft); }
.step-tag i.on { background: var(--accent); color: var(--ink); }

.next-row { min-height: 54px; display: flex; justify-content: center; }

/* fly star */
.fly { position: fixed; z-index: 50; width: 36px; height: 36px; pointer-events: none; }

/* modal */
.modal-back { position: fixed; inset: 0; z-index: 40; background: rgba(52, 55, 79, .6); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--paper); border-radius: var(--r-lg); padding: 24px 20px; width: min(420px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; animation: rise .4s ease; }
.modal h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 28px; }
.modal p { margin: 0; font-size: 17px; color: var(--ink-soft); }
.modal .coco-wrap { width: 120px; }
.earned { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.new-planet { display: flex; align-items: center; gap: 12px; background: var(--accent-soft); border-radius: 18px; padding: 10px 16px; font-family: var(--f-display); font-size: 18px; }
.modal-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
@keyframes rise { from { transform: translateY(20px); opacity: .4 } }

/* parent */
.parent { background: var(--paper); border-radius: var(--r-lg); padding: 20px 16px; display: flex; flex-direction: column; gap: 18px; }
.parent h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 24px; }
.parent h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 19px; }
.parent p.help { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.5; }
.gate { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.gate-q { font-family: var(--f-display); font-size: 26px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field { border: 2px solid var(--paper-2); background: var(--paper); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; color: var(--ink); width: 100%; min-width: 0; }
.field:focus { border-color: var(--primary); outline: none; }
.field.word { font-family: var(--f-word); font-size: 18px; }
.gate .field { width: 110px; font-size: 22px; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row-head, .wrow { display: grid; grid-template-columns: 26px 54px minmax(0, 1.2fr) minmax(0, 1fr) 36px; gap: 8px; align-items: center; }
.row-head { font-size: 13px; color: var(--ink-soft); padding: 0 2px; }
.wrow .num { font-size: 14px; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
.wrow .field.em { text-align: center; font-size: 22px; padding: 6px 4px; }
.x-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--paper-2); color: var(--ink-soft); font-size: 20px; line-height: 1; }
.srow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 8px; }
.p-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; background: var(--paper-2); border-radius: 999px; padding: 4px; gap: 4px; align-self: flex-start; }
.seg-btn { min-height: 44px; padding: 0 22px; border-radius: 999px; font-family: var(--f-display); font-size: 18px; color: var(--ink-soft); }
.seg-btn.on { background: var(--primary); color: var(--ink); }
/* home-screen install guide (parents) */
.ig { display: flex; flex-direction: column; gap: 12px; background: var(--paper-2); border-radius: 20px; padding: 16px 18px; word-break: keep-all; }
.ig h3 { margin: 0; }
.ig .seg { display: inline-grid; grid-template-columns: 1fr 1fr; max-width: 100%; background: var(--paper); border-radius: 22px; }
.ig .seg-btn { white-space: nowrap; border-radius: 18px; min-height: 48px; }
@media (max-width: 600px) { .ig .seg { display: grid; width: 100%; } .ig .seg-btn { font-size: 15px; padding: 0 8px; } }
.ig .seg-btn.on::before { content: "✓ "; }
.ig ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 1.6; }
.ig .ic { display: inline-block; width: 22px; height: 22px; vertical-align: -5px; margin: 0 2px; padding: 2px; border-radius: 6px; background: var(--paper); color: var(--ink); }
.ig .help small { display: block; margin-top: 4px; }
.danger-zone { border-top: 2px dashed var(--paper-2); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.err { color: #B4434C; font-size: 15px; margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 12px 20px; font-family: var(--f-display); font-size: 16px; max-width: calc(100% - 32px); text-align: center; }

.empty { background: var(--paper); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 20px; }
.empty p { margin: 0; color: var(--ink-soft); line-height: 1.5; }

/* parent onboarding */
.onb { width: 100%; max-width: 820px; margin: 0 auto; box-sizing: border-box; background: var(--paper); border-radius: var(--r-lg); padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; min-height: calc(100dvh - 72px); word-break: keep-all; }
.onb-top { display: flex; justify-content: space-between; align-items: center; }
.onb-tag { font-family: var(--f-display); font-size: 15px; color: var(--primary-deep, #2FA585); background: var(--primary-soft); padding: 6px 14px; border-radius: 999px; }
.onb-body { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.onb h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 28px; line-height: 1.3; }
.onb h3 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 600; font-size: 19px; }
.onb-lead { margin: 0; font-size: 18px; line-height: 1.6; color: var(--ink); }
.onb-hero { display: flex; justify-content: center; }
.onb-hero .coco-wrap { width: 120px; }
.onb-points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.onb-points li { display: flex; gap: 14px; align-items: flex-start; background: var(--paper-2); border-radius: 18px; padding: 12px 16px; font-size: 16px; line-height: 1.55; color: var(--ink-soft); }
.onb-points li > span { font-size: 28px; line-height: 1.2; }
.onb-points b { color: var(--ink); }
.onb-points li > div > b:first-child { display: block; font-size: 18px; }
.onb-steps { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 10px; font-size: 18px; line-height: 1.55; }
.onb-tip { background: var(--accent-soft); border-radius: 16px; padding: 12px 16px; font-size: 16px; line-height: 1.55; }
.onb-games { display: flex; flex-direction: column; gap: 10px; }
.onb-games section { background: var(--paper-2); border-radius: 18px; padding: 12px 16px; }
.onb-games p { margin: 0; font-size: 15.5px; line-height: 1.7; color: var(--ink-soft); }
.onb-games p b { color: var(--ink); }
.onb-seg { align-self: center; }
.onb-start { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.onb-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.onb-nav .dots i { background: var(--paper-2); }
.onb-nav .dots i.now, .onb-nav .dots i.done { background: var(--primary); box-shadow: none; }
.onb-nav-sp { width: 88px; }
.onb-link { align-self: flex-start; }

/* children & account */
.kids { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 520px; align-self: center; }
.parent .kids { align-self: stretch; }
.kid-row { display: flex; align-items: center; gap: 10px; background: var(--paper-2); border-radius: 16px; padding: 6px 8px 6px 6px; border: 2px solid transparent; }
.kid-row.on { border-color: var(--primary); }
.kid-row .field { flex: 1; min-width: 0; font-size: 18px; box-sizing: border-box; }
.kid-stars { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kid-add { display: flex; gap: 8px; }
.kid-add .field { flex: 1; min-width: 0; font-size: 17px; box-sizing: border-box; }
.kid-switch { display: inline-flex; background: var(--bg-deep); border: 2px solid var(--bg-line); border-radius: 999px; padding: 3px; gap: 2px; }
.kid-switch button { min-height: 38px; padding: 0 14px; border-radius: 999px; font-family: var(--f-display); font-size: 16px; color: var(--on-bg-soft); }
.kid-switch button.on { background: var(--success); color: var(--ink); font-weight: 700; }
.kid-switch button.on::before { content: "✓ "; }
.account { display: flex; flex-direction: column; gap: 10px; border-top: 2px dashed var(--paper-2); padding-top: 16px; }
.auth { max-width: 520px; }
.auth .onb-body { gap: 16px; }
.auth-tabs { align-self: center; }
.auth-form { display: flex; flex-direction: column; gap: 12px; }
.auth-form label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 15px; }
.auth-form label small { font-weight: 500; color: var(--ink-soft); }
.auth-form .field { font-size: 18px; width: 100%; box-sizing: border-box; }
.auth-form .auth-agree { flex-direction: row; align-items: flex-start; gap: 10px; font-weight: 500; line-height: 1.5; color: var(--ink-soft); }
.auth-agree input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--primary); flex: none; }
.auth-form .btn { align-self: stretch; }
.auth-links { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.linkbtn { color: var(--ink-soft); text-decoration: underline; font-size: 15px; padding: 6px; }
p.ok { margin: 0; color: var(--primary-deep, #2FA585); font-weight: 700; line-height: 1.5; }

/* spelling & sentence games */
.word-big .hole.now { border-style: solid; box-shadow: 0 0 0 4px var(--primary-soft); }
.word-big .hole { font-family: var(--f-word); color: var(--ink); }
.blk.chunk { font-size: 30px; min-width: 70px; }
.build-line.joined { gap: 0; }
.build-line.joined .placed { border-radius: 0; }
.build-line.joined .placed:first-child { border-radius: 14px 0 0 14px; }
.build-line.joined .placed:last-child { border-radius: 0 14px 14px 0; }
.keyboard { flex-direction: column; align-items: center; gap: 8px; max-width: none; }
.keyboard .krow { display: flex; gap: 8px; justify-content: center; }
.keyboard .tile { width: 58px; height: 58px; font-size: 30px; }
.frame-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; font-family: var(--f-word); font-weight: 700; font-size: 36px; color: var(--ink); }
.frame-line .slots { flex-wrap: nowrap; }
.frame-line.done .slot { background: var(--success); }
.write-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 16px; font-family: var(--f-word); font-weight: 700; font-size: 34px; color: var(--ink); max-width: 900px; }
.write-line .wdone { color: var(--primary-deep, #2FA585); }
.write-line .wtodo { color: var(--ink-soft); opacity: .45; letter-spacing: 4px; }
.write-line .slots { flex-wrap: nowrap; }
/* new games */
.mem-grid { display: grid; gap: 14px; width: 100%; max-width: 620px; }
.mem-card { position: relative; aspect-ratio: 4 / 3; border-radius: 22px; background: var(--bg-deep); border: 3px solid var(--bg-line); display: grid; place-items: center; transition: transform .15s, background .2s; }
.mem-card .mc-back { width: 56px; height: 56px; }
.mem-card .mc-back svg { width: 100%; height: 100%; display: block; }
.game-card .mark.emo { font-size: 24px; }
.mem-card .mc-face { display: none; }
.mem-card.open { background: var(--paper-2); border-color: var(--paper-2); }
.mem-card.open .mc-back { display: none; }
.mem-card.open .mc-face { display: block; }
.mem-card.match { background: var(--success); border-color: var(--primary); }
.mc-pic { font-size: 54px; line-height: 1; }
/* right answers get a check mark too, so color is never the only signal */
.pick.right::after, .meteor.right::after, .mem-card.match::after, .fall.caught::after, .tp-card.on::after {
  content: "✓"; position: absolute; top: -10px; right: -10px; width: 32px; height: 32px; border-radius: 50%;
  background: var(--primary-deep); color: #fff; font: 700 20px/32px var(--f-body); text-align: center; box-shadow: 0 0 0 3px var(--paper); z-index: 2; }
.fall.caught::after { top: -6px; right: 10%; }
.mem-card .mc-face { max-width: 100%; padding: 0 8px; }
.mc-word { font-family: var(--f-word); font-weight: 700; font-size: 30px; color: var(--ink); white-space: nowrap; display: block; overflow: hidden; text-overflow: ellipsis; }
.meteors { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.meteor { position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 999px; background: var(--paper-2); border: 3px solid transparent; font-family: var(--f-word); font-size: 32px; color: var(--ink); animation: drift 3s ease-in-out infinite; }
.meteor span { display: inline-flex; }
.meteor.right { background: var(--success); border-color: var(--primary); }
.meteor.dim { opacity: .35; }
@keyframes drift { 50% { transform: translateY(-6px) } }
.peek-bar { width: min(420px, 80%); height: 10px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
.peek-bar i { display: block; height: 100%; background: var(--primary); animation: peekbar linear forwards; }
@keyframes peekbar { from { width: 100% } to { width: 0 } }
.catch-head { display: flex; align-items: center; gap: 16px; }
.catch-head .pic { font-size: 64px; }
.catch-sky { position: relative; width: 100%; max-width: 760px; height: 340px; border-radius: 24px; background: var(--bg-deep); overflow: hidden; }
.fall { position: absolute; top: -90px; width: 28%; display: flex; flex-direction: column; align-items: center; gap: 2px; animation: fall linear infinite; }
.fall b { font-family: var(--f-word); font-size: 26px; color: var(--ink); background: var(--paper); padding: 2px 12px; border-radius: 999px; box-shadow: 0 2px 0 rgba(0,0,0,.12); }
.fall.gone { visibility: hidden; }
.fall.caught { animation-play-state: paused; }
.fall.caught b { background: var(--success); color: var(--ink); }
@keyframes fall { from { transform: translateY(0) } to { transform: translateY(440px) } }
.bonus { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink); background: var(--accent-soft); padding: 6px 14px; border-radius: 999px; }
@media (prefers-reduced-motion: reduce) { .fall { top: 30%; } }

/* reward burst on a right answer (short; never covers the next tap target for long) */
.burst { position: fixed; z-index: 55; width: 24px; height: 24px; pointer-events: none; }
.burst svg { width: 100%; height: 100%; display: block; }

/* level up, badges, guide upgrades */
.levelup { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; background: var(--accent-soft); border-radius: 20px; padding: 12px 14px; }
.levelup .new-planet { background: var(--paper); }
.lvl-tag { font-family: var(--f-display); font-size: 20px; color: var(--ink); }
.levelup .planet { animation: glow 1.4s ease-in-out 2; }
@keyframes glow { 50% { transform: scale(1.1); filter: drop-shadow(0 0 8px var(--accent)); } }
.badge { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); border-radius: 999px; padding: 4px 14px 4px 4px; font-family: var(--f-display); font-size: 16px; color: var(--ink); max-width: 100%; }
.badge svg { width: 36px; height: 36px; flex: none; }
.badge span { min-width: 0; overflow-wrap: anywhere; text-align: left; }
.upgrade { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 16px; text-align: left; }
.upgrade .coco-wrap { width: 58px; }
.badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }

/* empty + loading */
.empty-art { width: 100%; max-width: 360px; aspect-ratio: 5 / 3; border-radius: 20px; overflow: hidden; align-self: center; }
.loading { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 48px 16px; color: var(--on-bg); text-align: center; }
.loading .coco-wrap { width: 132px; }
.loading .load-spin { width: 44px; height: 44px; animation: spin 1.6s linear infinite; }
.loading .load-spin svg { width: 100%; height: 100%; display: block; }
.loading p { margin: 0; font-family: var(--f-display); font-size: 20px; }

/* theme picker: four self-themed cards (each card carries its own data-theme), a live preview and one confirm button */
.tp { display: flex; flex-direction: column; gap: 16px; }
.tp-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tp-head > div { flex: 1; min-width: 220px; }
.tp-head h1 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 28px; line-height: 1.2; color: var(--on-bg); }
.tp-head p { margin: 4px 0 0; font-size: 17px; color: var(--on-bg-soft); word-break: keep-all; }
.tp-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tp-card { position: relative; display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 8px 8px 14px; border-radius: 26px; background: var(--bg-grad, var(--bg)); background-color: var(--bg); color: var(--on-bg); border: 4px solid var(--bg-line); transition: transform .15s ease, box-shadow .15s ease; min-width: 0; }
.tp-card:active { transform: scale(.98); }
.tp-img { display: block; border-radius: 18px; overflow: hidden; aspect-ratio: 5 / 3; }
.tp-name { font-family: var(--f-display); font-weight: 600; font-size: 20px; line-height: 1.15; padding: 8px 6px 0; }
.tp-ko { font-family: var(--f-display); font-size: 16px; color: var(--on-bg-soft); padding: 0 6px; }
.tp-desc { font-size: 14.5px; line-height: 1.4; color: var(--on-bg-soft); padding: 2px 6px 0; word-break: keep-all; }
.tp-pick { align-self: flex-start; margin: 8px 6px 0; font-family: var(--f-display); font-size: 15px; padding: 4px 12px; border-radius: 999px; background: var(--paper); color: var(--ink); border: 2px dashed var(--bg-line); }
.tp-card.on { border-color: var(--accent); border-width: 6px; padding: 6px 6px 12px; transform: translateY(-4px); box-shadow: 0 0 0 4px var(--paper), 0 10px 24px rgba(0, 0, 0, .2); }
.tp-card.on .tp-pick { border-style: solid; border-color: var(--accent); background: var(--accent); font-weight: 600; }
.tp-preview { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; background: var(--bg-deep); border: 2px solid var(--bg-line); border-radius: var(--r-lg); padding: 14px 16px; color: var(--on-bg); }
.tp-preview .hero { flex: 1 1 300px; min-width: 0; }
.tp-preview .coco-wrap { width: 96px; }
.tp-preview .bubble { font-size: 18px; }
.tp-pv-side { display: flex; flex-direction: column; gap: 10px; flex: 1 1 240px; min-width: 0; }
.tp-pv-map { display: flex; align-items: center; gap: 8px; }
.tp-pv-map .nm { font-family: var(--f-display); font-size: 13px; color: var(--on-bg); text-align: center; overflow-wrap: anywhere; }
.tp-pv-map > span { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.tp-pv-map i { flex: none; width: 16px; border-top: 3px dashed var(--bg-line); }
.tp-pv-play { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tp-pv-play .tile { width: 46px; height: 46px; font-size: 26px; border-radius: 14px; display: inline-grid; place-items: center; }
.tp-hint { margin: 0; font-family: var(--f-display); font-size: 20px; color: var(--on-bg); text-align: center; padding: 18px 8px; }
.tp-hint small { display: block; font-size: 15px; color: var(--on-bg-soft); }
.tp-foot { position: sticky; bottom: 0; z-index: 5; display: flex; justify-content: center; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
.tp-foot .btn { min-width: min(100%, 320px); box-shadow: 0 6px 18px rgba(0, 0, 0, .22); }

@media (max-width: 520px) {
  .keyboard .krow { gap: 6px; }
  .keyboard .tile { width: min(50px, calc((100vw - 104px) / 6)); height: 52px; font-size: 28px; }
  .brand-ko { font-size: 20px; }
  .coco-wrap { width: 96px; }
  .hero-art { width: 100px; }
  .hero-art .coco-wrap { width: 88px; }
  .tp-head h1 { font-size: 23px; }
  .tp-name { font-size: 17px; }
  .tp-desc { font-size: 13.5px; }
  .bubble { font-size: 18px; }
  .guide .coco-wrap { width: 72px; }
  .guide .bubble { font-size: 16px; padding: 10px 14px; }
  .slot { width: 44px; height: 56px; font-size: 34px; }
  .gap { height: 56px; }
  .tile { width: 56px; height: 56px; font-size: 30px; }
  .word-big { font-size: 44px; }
  .learn-word { font-size: 50px; }
  .sentence { font-size: 24px; }
  .row-head, .wrow { grid-template-columns: 50px minmax(0, 1.2fr) minmax(0, 1fr) 36px; }
  .row-head .num, .wrow .num { display: none; }
  .srow { grid-template-columns: 1fr; }
  .pick .pe { font-size: 42px; }
  .pick .pw { font-size: 17px; }
}
/* trace & write */
.trace-head { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.trace-head .pic { font-size: 56px; }
.model-word { font-family: var(--f-word); font-weight: 700; font-size: 40px; color: var(--ink); background: var(--accent-soft); border-radius: 16px; padding: 2px 18px; }
.pad { position: relative; width: 100%; height: clamp(220px, 40vh, 340px); background: var(--paper); border: 3px solid var(--paper-2); border-radius: 24px; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pad canvas.ink { touch-action: none; cursor: crosshair; }
.pad-tools { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--paper); box-shadow: 0 0 0 2px var(--paper-2); }
.swatch.on { box-shadow: 0 0 0 3px var(--ink); }
.pencil-note { font-size: 14px; color: var(--ink-soft); }
@media (orientation: landscape) and (min-width: 900px) {
  .pad { height: clamp(260px, 44vh, 400px); }
  .trace-head .pic { font-size: 64px; }
  .model-word { font-size: 48px; }
}

/* photo import */
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.scan { background: var(--primary-soft); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.scan-status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.paste-box { display: flex; flex-direction: column; gap: 10px; }
.field.paste { font-family: var(--f-word); font-size: 17px; line-height: 1.5; resize: vertical; min-height: 110px; }
.scan-thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 12px; border: 3px solid var(--paper); }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--paper); border-top-color: var(--primary); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
.scan-list { display: flex; flex-wrap: wrap; gap: 8px; }
.scan-item { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border-radius: 999px; padding: 6px 12px 6px 8px; cursor: pointer; }
.scan-item input { width: 20px; height: 20px; accent-color: var(--primary); }
.scan-item .w { font-family: var(--f-word); font-weight: 700; font-size: 17px; }
.scan-item small { color: var(--ink-soft); font-size: 14px; }
.scan-sent { display: flex; flex-direction: column; gap: 6px; }
.scan-sent .scan-item { border-radius: 14px; }

/* home & game grids (phone/portrait: one stacked column) */
.home-grid { display: flex; flex-direction: column; gap: 18px; }
.col-l, .col-r { display: contents; }
.home-grid .hero { order: 1; }
.home-grid .journey { order: 2; }
.home-grid .games-sec, .home-grid .empty { order: 3; }
.home-grid .shelf { order: 4; }
.games-sec { display: flex; flex-direction: column; gap: 10px; }
.game-grid { display: flex; flex-direction: column; gap: 14px; }
.p-grid { display: flex; flex-direction: column; gap: 18px; }
.p-part { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
body { touch-action: manipulation; }
.play, .tiles, .blocks, .opts, .pick-row { -webkit-user-select: none; user-select: none; }
@media (hover: none) { .game-card:hover { transform: none; } }

/* iPad landscape */
@media (orientation: landscape) and (min-width: 900px) {
  #app { max-width: 1366px; padding-inline: 24px; padding-block: 16px 24px; min-height: 100%; }

          <div class="chips">${w.words.map(x => {
            const m = Math.min(3, state.progress.mastery[x.en] || 0);
            return `<span class="chip"><span class="em">${esc(emojiFor(x))}</span><span class="w">${esc(x.en)}</span><span class="ms" aria-label="${m} of 3 ${t.reward[1]}">${[0, 1, 2].map(k => rIcon(14, k < m)).join('')}</span></span>`;
          }).join('')}</div>
          ${w.sentences.length ? `<div class="sent-list">${w.sentences.map(s => `<p>${esc(s.en)}<small>${esc(s.ko)}</small></p>`).join('')}</div>` : ''}
        </section>`;
    } else {
      body = `
        <section class="empty">
          <div class="empty-art">${sceneSVG(false)}</div>
          <h3>Waiting for this week's words</h3>
          <p>Add about 10 English words and 2 sentences in the grown-ups menu to open all the games. You can also try it with example words first.</p>
          <div class="p-actions"><button class="btn" data-act="parent">Open grown-ups menu</button><button class="btn ghost" data-act="try-example">Try example words</button></div>
        </section>`;
    }
    app.innerHTML = `
      <header class="top">
        <div class="brand"><span class="brand-ko">${esc(kid())}'s ${esc(t.world)}</span><span class="brand-en">Spelling adventures with ${esc(t.guide)}</span></div>
        <div class="top-r">${kidSwitchHTML()}${starPill()}
          <button class="icon-btn" data-act="theme-open" aria-label="Change theme">${paletteSVG}</button>
          <button class="icon-btn ${state.sound ? '' : 'off'}" data-act="sound" aria-label="${state.sound ? 'Turn sound effects off' : 'Turn sound effects on'}">${noteSVG(state.sound)}</button>
          <button class="icon-btn" data-act="parent" aria-label="Grown-ups menu">${lockSVG}</button></div>
      </header>
      <div class="home-grid">
        <div class="col-l">
          <section class="hero"><div class="hero-art"><span class="hero-bg">${sceneSVG(true)}</span><div class="coco-wrap">${mascot()}</div></div><div class="bubble" id="bubble">${oldBubble || greet}</div></section>
          ${shelf}
        </div>
        <div class="col-r">${journey}${body}</div>
      </div>`;
  }

  /* ---------- game frame ---------- */
  function startGame(type) {
    const w = state.week; if (!w || !w.words.length) return;
    let queue;
    if (type === 'learn') queue = w.words.slice();
    else if (type === 'sentence' || type === 'swrite' || type === 'strace') queue = w.sentences.slice();
    else if (type === 'vowel') queue = shuffle(w.words.filter(x => /[aeiou]/.test(x.en))).slice(0, 5);
    else if (type === 'memory') { const s = shuffle(w.words), n = Math.min(3, s.length); queue = [s.slice(0, n)]; if (s.length >= 4) queue.push(s.length >= n + 2 ? s.slice(n, n + 3) : shuffle(s).slice(0, n)); }
    else queue = shuffle(w.words).slice(0, Math.min(5, w.words.length));
    if (!queue.length) return;
    g = { type, queue, i: 0, earned: 0, startPlanet: planetIndex(state.progress.stars) };
    screen = 'game';
    const name = gameName(type);
    app.innerHTML = `
      <header class="game-top"><button class="back" data-act="home">‹ Home</button><div class="dots" id="dots"></div>${starPill()}</header>
      <div class="game-grid">
        <section class="guide"><div class="coco-wrap">${mascot()}</div><div class="bubble" id="bubble"></div></section>
        <section class="play" id="play" aria-label="${esc(name)}"></section>
      </div>`;
    renderRound();
  }
  function updateDots() {
    const d = document.getElementById('dots'); if (!d || !g) return;
    d.innerHTML = g.queue.map((_, k) => `<i class="${k < g.i ? 'done' : k === g.i ? 'now' : ''}">${k < g.i ? rIcon(20) : ''}</i>`).join('');
    d.setAttribute('aria-label', `${Math.min(g.i, g.queue.length)} of ${g.queue.length} done`);
  }
  function renderRound() {
    seq++;
    if (tts) tts.cancel();
    updateDots();
    ({ learn: renderLearn, trace: renderTrace, spell: renderSpell, missing: renderMissing, listen: renderListen, sentence: renderSentence,
      vowel: renderVowel, chunk: renderChunk, bee: renderBee, frame: renderFrame, swrite: renderSWrite, strace: renderTrace,
      memory: renderMemory, meteor: renderMeteor, peek: renderPeek, catch: renderCatch })[g.type]();
  }
  function nextRound() {
    sfx.tap();
    g.i++;
    if (g.i >= g.queue.length) finishGame(); else renderRound();
  }
  const play = () => document.getElementById('play');
  const nextBtnHTML = () => `<div class="next-row" id="nextRow"></div>`;
  function showNext(label = 'Next') {
    const r = document.getElementById('nextRow'); if (!r) return;
    const last = g.i >= g.queue.length - 1;
    r.innerHTML = `<button class="btn sun" data-act="next">${last ? esc(T().finish) : label} ${last ? rIcon(22) : '<span aria-hidden="true">›</span>'}</button>`;
  }
  function award(n, el, word) {
    state.progress.stars += n;
    g.earned += n;
    if (word) state.progress.mastery[word] = (state.progress.mastery[word] || 0) + 1;
    saveProgress();
    sfx.good(); setTimeout(() => sfx.star(), 320);
    burst(el);
    flyStar(el);
    if (n > 1) setTimeout(() => flyStar(el), 250);
    mood('happy');
    const ko = praiseLine(), en = rnd(PRAISE_EN);
    say(ko, en);
    return { ko, en };
  }
  function oops(el) {
    if (g) g.oops = (g.oops || 0) + 1;
    sfx.soft();
    if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    mood('think', 1200);
    say(cheerLine());
  }
  const promptHTML = (w) => `
    <div class="prompt">
      <div class="pic" aria-hidden="true">${esc(emojiFor(w))}</div>
      ${w.ko ? `<div class="ko">${esc(w.ko)}</div>` : ''}
      <button class="say-btn" data-act="say-word">${speakerSVG} Listen</button>
    </div>`;

  /* learn */
  function renderLearn() {
    const w = g.queue[g.i];
    const last = g.i === g.queue.length - 1;
    play().innerHTML = `
      <div class="game-name">Word Cards · ${g.i + 1} / ${g.queue.length}</div>
      <div class="pic" aria-hidden="true">${esc(emojiFor(w))}</div>
      <div class="learn-word word-big" id="lw">${[...w.en].map((c, k) => `<span class="lt" data-k="${k}">${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join('')}</div>
      ${w.ko ? `<div class="ko">${esc(w.ko)}</div>` : ''}
      <div class="learn-nav">
        <button class="btn" data-act="say-word">${speakerSVG} Hear the word</button>
        <button class="btn ghost" data-act="spell-slow">Letter by letter</button>
      </div>
      <div class="learn-nav">
        <button class="btn ghost sm" data-act="prev" ${g.i === 0 ? 'disabled style="opacity:.4"' : ''}>‹ Back</button>
        <button class="btn sun sm" data-act="${last ? 'learn-done' : 'next'}">${last ? 'All done!' : 'Next word ›'}</button>
      </div>`;
    say(`Say it with me: "${w.en}"`, w.ko ? `Meaning: ${w.ko}` : '');
    setTimeout(() => speak(w.en), 250);
  }
  function highlightLetter(idx) {
    document.querySelectorAll('#lw .lt').forEach(e => e.classList.toggle('on', Number(e.dataset.k) === idx));
  }

  /* spell */
  function renderSpell() {
    const w = g.queue[g.i];
    const chars = [...w.en];
    const letters = chars.filter(isLetter);
    const ghost = (state.progress.mastery[w.en] || 0) < 2;
    const nDecoy = letters.length <= 4 ? 2 : letters.length <= 6 ? 1 : 0;
    const pool = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(c => !letters.includes(c));
    const decoys = shuffle(pool).slice(0, nDecoy);
    const tiles = shuffleNew(letters.concat(decoys));
    g.chars = chars; g.pos = -1; g.miss = 0; g.done = false; g.onSpelled = null;
    play().innerHTML = `
      <div class="game-name">${esc(gameName('spell'))} · ${g.i + 1} / ${g.queue.length}</div>
      ${promptHTML(w)}
      <div class="slots" id="slots">${chars.map((c, k) => isLetter(c)
        ? `<span class="slot" data-k="${k}"><span class="ghost">${ghost ? esc(c) : ''}</span></span>`
        : `<span class="gap">${c === ' ' ? '' : esc(c)}</span>`).join('')}</div>
      <div class="tiles" id="tiles">${tiles.map(c => `<button class="tile" data-act="tile" data-ch="${esc(c)}" aria-label="${L(c)}">${esc(c)}</button>`).join('')}</div>
      ${nextBtnHTML()}`;
    advanceSlot();
    say(ghost ? 'Tap the letters that match the faded ones.' : 'Can you spell it?', ghost ? 'Start from the left.' : 'Tap the letters in order.');
    setTimeout(() => speak(w.en), 250);
  }
  function advanceSlot() {
    g.pos++;
    while (g.pos < g.chars.length && !isLetter(g.chars[g.pos])) g.pos++;
    document.querySelectorAll('#slots .slot').forEach(s => s.classList.toggle('next', Number(s.dataset.k) === g.pos));
    g.miss = 0;
    document.querySelectorAll('#tiles .tile.hint').forEach(t => t.classList.remove('hint'));
  }
  function tapTile(btn) {
    if (g.done) return;
    const ch = btn.dataset.ch, want = g.chars[g.pos];
    if (ch === want) {
      if (!btn.classList.contains('key')) btn.classList.add('used');
      const slot = document.querySelector(`#slots .slot[data-k="${g.pos}"]`);
      slot.classList.add('filled', 'pop'); slot.insertAdjacentHTML('beforeend', esc(ch));
      sfx.pop(); speak(sayL(ch), { rate: .8 });
      advanceSlot();
      if (g.pos >= g.chars.length) {
        g.done = true;
        document.querySelectorAll('#slots .slot.next').forEach(s => s.classList.remove('next'));
        if (g.onSpelled) { g.onSpelled(); return; }
        const w = g.queue[g.i];
        const p = award(1, document.getElementById('slots'), w.en);
        setTimeout(() => speakSpelling(w.en, { onend: () => speak(p.ko, { cancel: false, rate: .9 }) }), 450);
        showNext();
      }
    } else {
      oops(btn);
      g.miss++;
      if (g.miss >= 2) {
        const right = [...document.querySelectorAll('#tiles .tile:not(.used)')].find(t => t.dataset.ch === want);
        if (right) right.classList.add('hint');
        say('Tap the glowing letter.', `Find "${L(want)}"`);
        speak(sayL(want));
      }
    }
  }

  /* missing */
  function renderMissing() {
    const w = g.queue[g.i];
    const chars = [...w.en];
    const idxs = chars.map((c, k) => isLetter(c) ? k : -1).filter(k => k >= 0);
    const hole = rnd(idxs);
    const right = chars[hole];
    const others = shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c => c !== right)).slice(0, 2);
    g.hole = hole; g.right = right; g.done = false;
    play().innerHTML = `
      <div class="game-name">${esc(gameName('missing'))} · ${g.i + 1} / ${g.queue.length}</div>
      ${promptHTML(w)}
      <div class="word-big" id="mw">${chars.map((c, k) => k === hole ? `<span class="hole" id="hole"></span>` : `<span class="lt">${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join('')}</div>
      <div class="opts">${shuffle([right, ...others]).map(c => `<button class="opt-star" data-act="opt" data-ch="${esc(c)}" aria-label="${L(c)}">${optShape()}<span>${esc(c)}</span></button>`).join('')}</div>
      ${nextBtnHTML()}`;
    say(`Which ${T().reward[0]} fills the gap?`, 'Find the missing letter.');
    setTimeout(() => speak(w.en), 250);
  }
  function tapOpt(btn) {
    if (g.done) return;
    if (btn.dataset.ch === g.right) {
      g.done = true;
      const h = document.getElementById('hole'); h.textContent = g.right; h.classList.add('filled');
      document.querySelectorAll('.opt-star').forEach(b => { if (b !== btn) b.classList.add('dim'); });
      const w = g.queue[g.i];
      const p = award(1, h, w.en);
      setTimeout(() => speakSpelling(w.en, { onend: () => speak(p.ko, { cancel: false, rate: .9 }) }), 400);
      showNext();
    } else {
      btn.classList.add('dim'); oops(btn);
    }
  }

  /* listen */
  function renderListen() {
    const w = g.queue[g.i];
    const others = shuffle(state.week.words.filter(x => x.en !== w.en)).slice(0, 2);
    g.done = false;
    play().innerHTML = `
      <div class="game-name">Sound Hunt · ${g.i + 1} / ${g.queue.length}</div>
      <button class="listen-big" data-act="say-word" aria-label="Listen again">${speakerSVG}</button>
      <div class="pick-row" style="grid-template-columns:repeat(${others.length + 1}, minmax(0,1fr))">${shuffle([w, ...others]).map(x => `<button class="pick" data-act="pick" data-en="${esc(x.en)}"><span class="pe" aria-hidden="true">${esc(emojiFor(x))}</span><span class="pw">${esc(x.en)}</span></button>`).join('')}</div>
      ${nextBtnHTML()}`;
    say('Listen carefully and pick the picture.', 'Tap the speaker to hear it again.');
    setTimeout(() => speak(w.en), 300);
  }
  function tapPick(btn) {
    if (g.done) return;
    const w = g.queue[g.i];
    if (btn.dataset.en === w.en) {
      g.done = true;
      btn.classList.add('right');
      document.querySelectorAll('.pick').forEach(b => { if (b !== btn) b.classList.add('dim'); });
      const p = award(1, btn, w.en);
      setTimeout(() => speak(`${w.en}! ${p.ko}`), 400);
      showNext();
    } else {
      btn.classList.add('dim'); oops(btn);
      setTimeout(() => speak(w.en), 350);
    }
  }

  /* shared: letter slots + tiles for one word */
  function slotsHTML(chars) {
    return `<div class="slots" id="slots">${chars.map((c, k) => isLetter(c)
      ? `<span class="slot" data-k="${k}"><span class="ghost"></span></span>`
      : `<span class="gap">${c === ' ' ? '' : esc(c)}</span>`).join('')}</div>`;
  }
  function tilesHTML(word, extra = 1) {
    const letters = [...word].filter(isLetter);
    const pool = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(c => !letters.includes(c.toLowerCase()) && !letters.includes(c));
    const tiles = shuffleNew(letters.concat(shuffle(pool).slice(0, extra)));
    return `<div class="tiles" id="tiles">${tiles.map(c => `<button class="tile" data-act="tile" data-ch="${esc(c)}" aria-label="${L(c)}">${esc(c)}</button>`).join('')}</div>`;
  }
  function startSlots(word, onSpelled) {
    g.chars = [...word]; g.pos = -1; g.miss = 0; g.done = false; g.onSpelled = onSpelled || null;
    advanceSlot();
  }

  /* vowel hunt: every vowel is a hole */
  const VOWELS = ['a', 'e', 'i', 'o', 'u'];
  function renderVowel() {
    const w = g.queue[g.i], chars = [...w.en];
    g.holes = chars.map((c, k) => VOWELS.includes(c) ? k : -1).filter(k => k >= 0);
    g.hi = 0; g.done = false;
    play().innerHTML = `
      <div class="game-name">Vowel Hunt · ${g.i + 1} / ${g.queue.length}</div>
      ${promptHTML(w)}
      <div class="word-big" id="vw">${chars.map((c, k) => g.holes.includes(k) ? `<span class="hole" data-k="${k}"></span>` : `<span class="lt">${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join('')}</div>
      <div class="opts">${VOWELS.map(v => `<button class="opt-star" data-act="vow" data-ch="${v}" aria-label="${L(v)}">${optShape()}<span>${v}</span></button>`).join('')}</div>
      ${nextBtnHTML()}`;
    markVowel();
    say('The vowels flew away!', 'Put a, e, i, o, u back.');
    setTimeout(() => speak(w.en), 250);
  }
  function markVowel() { document.querySelectorAll('#vw .hole').forEach(h => h.classList.toggle('now', Number(h.dataset.k) === g.holes[g.hi])); }
  function tapVowel(btn) {
    if (g.done) return;
    const w = g.queue[g.i], k = g.holes[g.hi], want = w.en[k];
    if (btn.dataset.ch === want) {
      const h = document.querySelector(`#vw .hole[data-k="${k}"]`);
      h.textContent = want; h.classList.add('filled'); h.classList.remove('now');
      sfx.pop(); speak(sayL(want), { rate: .8 });
      g.hi++;
      if (g.hi >= g.holes.length) {
        g.done = true;
        const p = award(1, document.getElementById('vw'), w.en);
        setTimeout(() => speakSpelling(w.en, { onend: () => speak(p.ko, { cancel: false, rate: .9 }) }), 450);
        showNext();
      } else markVowel();
    } else oops(btn);
  }

  /* chunk builder: join the word parts (onset + rime, or syllables) */
  function chunksOf(word) {
    const DIG = ['ch', 'sh', 'th', 'ph', 'wh', 'ck', 'ng', 'qu'];
    const syll = (w) => {
      if (w.length > 3 && /[^aeiou]le$/.test(w)) return syll(w.slice(0, -3)).concat(w.slice(-3));  // ap|ple, ta|ble
      const u = [];                                                                              // letters, digraphs kept whole
      for (let i = 0; i < w.length;) { const d = w.slice(i, i + 2); if (DIG.includes(d)) { u.push(d); i += 2; } else u.push(w[i++]); }
      const isV = (k) => /^[aeiou]$/.test(u[k]) || (u[k] === 'y' && k > 0) || (u[k] === 'e' && k === u.length - 1 && false);
      const vow = u.map((_, k) => isV(k) && !(u[k] === 'e' && k === u.length - 1 && k > 0 && !isV(k - 1)));  // final silent e is not a syllable
      const cuts = [];
      for (let k = 0; k < u.length; k++) {
        if (!vow[k] || vow[k + 1] !== false) continue;
        let j = k + 1; while (j < u.length && !vow[j]) j++;
        if (j >= u.length) break;                       // no vowel after this cluster
        const n = j - k - 1;
        if (n === 1) cuts.push(u[k + 1] === 'ck' || u[k + 1] === 'x' ? k + 2 : k + 1);   // ti|ger, rock|et
        else if (n === 2) cuts.push(k + 2);             // rab|bit
        else cuts.push(j - 1);                          // friend|ship
        k = j - 1;
      }
      const out = []; let st = 0;
      for (const c of cuts.concat(u.length)) { if (c > st) out.push(u.slice(st, c).join('')); st = c; }
      if (out.length === 1 && w.length >= 3) {          // one syllable: onset | rime (c|at, st|ar)
        const f = u.findIndex((_, k) => vow[k]);
        if (f > 0) return [u.slice(0, f).join(''), u.slice(f).join('')];
      }
      return out.length === 1 && w.length >= 2 ? [w[0], w.slice(1)] : out;
    };
    return word.split(' ').flatMap(syll);
  }

  function renderChunk() {
    const w = g.queue[g.i];
    g.parts = chunksOf(w.en); g.pos = 0; g.miss = 0; g.done = false;
    const others = state.week.words.filter(x => x.en !== w.en).flatMap(x => chunksOf(x.en)).filter(c => !g.parts.includes(c));
    const opts = shuffleNew(g.parts.map((t, k) => ({ t, k })).concat(others.length ? [{ t: rnd(others), k: -1 }] : []));
    play().innerHTML = `
      <div class="game-name">Chunk Builder · ${g.i + 1} / ${g.queue.length}</div>
      ${promptHTML(w)}
      <div class="build-line" id="line">${g.parts.map(() => `<span class="ph"></span>`).join('')}</div>
      <div class="blocks" id="blocks">${opts.map(o => `<button class="blk chunk" data-act="chk" data-t="${esc(o.t)}">${esc(o.t)}</button>`).join('')}</div>
      ${nextBtnHTML()}`;
    say('Join the word parts in order.', g.parts.join(' + '));
    setTimeout(() => speak(w.en), 250);
  }
  function tapChunk(btn) {
    if (g.done) return;
    const want = g.parts[g.pos];
    if (btn.dataset.t === want) {
      btn.classList.add('used');
      const el = document.createElement('span'); el.className = 'placed'; el.textContent = want;
      document.querySelector('#line .ph').replaceWith(el);
      sfx.pop(); speakSpelling(want);
      g.pos++; g.miss = 0;
      document.querySelectorAll('.blk.hint').forEach(b => b.classList.remove('hint'));
      if (g.pos >= g.parts.length) {
        g.done = true;
        document.getElementById('line').classList.add('joined');
        const w = g.queue[g.i];
        const p = award(1, document.getElementById('line'), w.en);
        setTimeout(() => speakSpelling(w.en, { onend: () => speak(p.ko, { cancel: false, rate: .9 }) }), 700);
        showNext();
      }
    } else {
      oops(btn); g.miss++;
      if (g.miss >= 2) { const r = [...document.querySelectorAll('.blk.chunk:not(.used)')].find(b => b.dataset.t === want); if (r) r.classList.add('hint'); }
    }
  }

  /* spelling bee: hear it and type it on an ABC keyboard */
  function renderBee() {
    const w = g.queue[g.i];
    // Narrow phones get 6 keys per row so the keyboard never runs off the screen.
    const rows = innerWidth < 600 ? ['abcdef', 'ghijkl', 'mnopqr', 'stuvwx', 'yz'] : ['abcdefghi', 'jklmnopqr', 'stuvwxyz'];
    play().innerHTML = `
      <div class="game-name">Spelling Bee · ${g.i + 1} / ${g.queue.length}</div>
      ${promptHTML(w)}
      ${slotsHTML([...w.en])}
      <div class="tiles keyboard" id="tiles">${rows.map(r => `<div class="krow">${[...r].map(c => `<button class="tile key" data-act="tile" data-ch="${c}" aria-label="${L(c)}">${c}</button>`).join('')}</div>`).join('')}</div>
      ${nextBtnHTML()}`;
    startSlots(w.en);
    say('Listen and type the word.', 'No peeking. You can do it!');
    setTimeout(() => speak(w.en), 250);
  }

  /* sentence maker: spell a word into a sentence frame */
  function frameFor(w) {
    const art = /^[aeiou]/.test(w.en) ? 'an' : 'a';
    const noun = !!(emojiFor(w) && /\p{Extended_Pictographic}/u.test(emojiFor(w)));
    return rnd(noun
      ? [[`I see ${art}`, '.'], ['I like the', '.'], ['This is my', '.'], ['Look at the', '!'], [`I have ${art}`, '.']]
      : [['I can spell', '.'], ['My word is', '.'], ['I can read', '!']]);
  }
  function renderFrame() {
    const w = g.queue[g.i], [pre, end] = frameFor(w);
    g.frame = `${pre} ${w.en}${end}`;
    play().innerHTML = `
      <div class="game-name">Sentence Maker · ${g.i + 1} / ${g.queue.length}</div>
      ${promptHTML(w)}
      <div class="frame-line" id="frameLine"><span class="fw">${esc(pre)}</span>${slotsHTML([...w.en])}<span class="fw">${esc(end)}</span></div>
      ${tilesHTML(w.en, 1)}

  /* meteor: pick the right spelling */
  function misspell(word, avoid) {
    const out = new Set(), V = 'aeiou', C = 'bcdfghklmnprstvwz';
    const ch = [...word], li = ch.map((c, k) => isLetter(c) ? k : -1).filter(k => k >= 0);
    for (let n = 0; out.size < 2 && n < 60; n++) {
      const a = ch.slice(), k = rnd(li), t = n % 4;
      if (t === 0 && li.length > 1) { const j = li[li.indexOf(k) + 1]; if (j === undefined || a[k] === a[j]) continue; [a[k], a[j]] = [a[j], a[k]]; }
      else if (t === 1) { const pool = (V.includes(a[k]) ? V : C).replace(a[k], ''); a[k] = rnd([...pool]); }
      else if (t === 2 && li.length > 2) a.splice(k, 1);
      else a.splice(k, 0, a[k]);
      const v = a.join('');
      if (v !== word && !avoid.includes(v)) out.add(v);
    }
    return [...out];
  }
  function renderMeteor() {
    const w = g.queue[g.i];
    const opts = shuffle([w.en, ...misspell(w.en, state.week.words.map(x => x.en))]);
    g.done = false;
    play().innerHTML = `
      <div class="game-name">${esc(gameName('meteor'))} · ${g.i + 1} / ${g.queue.length}</div>
      ${promptHTML(w)}
      <div class="meteors">${opts.map((o, k) => `<button class="meteor" data-act="met" data-v="${esc(o)}" style="animation-delay:${k * .25}s"><span aria-hidden="true">${rIcon(30)}</span><b>${esc(o)}</b></button>`).join('')}</div>
      ${nextBtnHTML()}`;
    say(`Which ${T().meteor} is spelled right?`, 'Look at every letter.');
    setTimeout(() => speak(w.en), 250);
  }
  function tapMeteor(btn) {

    const w = g.queue[g.i];

  function speakSentence(slow) {
    const s = g.queue[g.i];
    const starts = []; let pos = 0;
    g.toks.forEach(t => { starts.push(pos); pos += t.length + 1; });
    const mark = (k) => document.querySelectorAll('#sent .tk').forEach(e => e.classList.toggle('on', Number(e.dataset.k) === k));
    speak(s.en, {
      rate: slow ? .6 : .82,
      onboundary: (e) => { if (e.name && e.name !== 'word') return; let k = 0; starts.forEach((st, j) => { if (e.charIndex >= st) k = j; }); mark(k); },
      onend: () => mark(-1),
    });
  }

  /* trace & write (Apple Pencil) */
  const INKS = ['#34374F', '#2FA585', '#E9707A'];
  let pad = null;
  function renderTrace() {
    const w = g.queue[g.i], sent = g.type === 'strace';
    g.phase = 'trace'; g.done = false;
    const color = pad && pad.color || INKS[0];
    pad = null;
    play().innerHTML = `
      <div class="game-name">${sent ? 'Sentence Trace' : 'Trace &amp; Write'} · ${g.i + 1} / ${g.queue.length}</div>
      <div class="trace-head">

        ${w.ko ? `<span class="ko">${esc(w.ko)}</span>` : ''}

      </div>

      <div class="model-word" id="modelWord" hidden>${esc(w.en)}</div>
      <div class="pad" id="pad"><canvas class="guide" id="guideC"></canvas><canvas class="ink" id="inkC" aria-label="Writing pad"></canvas></div>
      <div class="pad-tools">
        ${INKS.map(c => `<button class="swatch ${c === color ? 'on' : ''}" style="background:${c}" data-act="ink" data-c="${c}" aria-label="Pencil color"></button>`).join('')}
        <button class="btn ghost sm" data-act="trace-clear">Erase</button>
        <button class="btn sm" data-act="trace-check" id="traceCheck">I'm done</button>
      </div>
      <div class="pencil-note">Apple Pencil works best. Fingers work too.</div>
      ${nextBtnHTML()}`;
    say(sent ? 'Trace the gray sentence.' : 'Trace the gray letters.', 'Go slowly, one letter at a time.');
    setTimeout(() => speak(w.en), 250);
    setupPad(color);
  }
  async function setupPad(color) {
    try { await document.fonts.load('700 120px Andika'); } catch {}
    const wrap = document.getElementById('pad'); if (!wrap || !g || (g.type !== 'trace' && g.type !== 'strace')) return;
    const gc = document.getElementById('guideC'), ic = document.getElementById('inkC');
    pad = { wrap, gc, ic, gctx: gc.getContext('2d'), ictx: ic.getContext('2d'), color, pencil: false, active: null, W: 0, H: 0 };
    layoutPad();
    if (window.ResizeObserver) new ResizeObserver(() => { if (pad && pad.wrap === wrap) layoutPad(); }).observe(wrap);
    ic.addEventListener('pointerdown', padDown);
    ic.addEventListener('pointermove', padMove);
    ic.addEventListener('pointerup', padUp);
    ic.addEventListener('pointercancel', padUp);
    ic.addEventListener('touchstart', e => { if (e.touches.length === 1) e.preventDefault(); }, { passive: false });
  }
  function layoutPad() {
    const r = pad.wrap.getBoundingClientRect();
    const W = Math.round(r.width), H = Math.round(r.height);
    if (!W || !H || (W === pad.W && H === pad.H)) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    pad.W = W; pad.H = H; pad.dpr = dpr;
    for (const c of [pad.gc, pad.ic]) { c.width = W * dpr; c.height = H * dpr; }
    pad.gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pad.ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const word = g.queue[g.i].en, ctx = pad.gctx;
    ctx.font = '700 100px Andika, "Trebuchet MS", sans-serif';
    const fs = Math.max(word.includes(' ') ? 24 : 40, Math.min(H * 0.5, (W - 56) / ctx.measureText(word).width * 100));
    pad.font = `700 ${fs}px Andika, "Trebuchet MS", sans-serif`; pad.fs = fs;
    ctx.font = pad.font;
    const asc = ctx.measureText('h').actualBoundingBoxAscent || fs * .72;
    const xh = ctx.measureText('x').actualBoundingBoxAscent || fs * .5;
    const desc = ctx.measureText('g').actualBoundingBoxDescent || fs * .22;
    const tw = ctx.measureText(word).width;
    pad.base = Math.round((H - asc - desc) / 2 + asc);
    pad.asc = asc; pad.xh = xh; pad.desc = desc;
    pad.x0 = (W - tw) / 2;
    pad.letters = [...word].map((ch, k) => {
      const a = pad.x0 + ctx.measureText(word.slice(0, k)).width, b = pad.x0 + ctx.measureText(word.slice(0, k + 1)).width;
      return { ch, x0: a, x1: b, done: !isLetter(ch), pts: [] };
    });
    // lenient mask of where the letters are
    const m = document.createElement('canvas'); m.width = W; m.height = H;
    const mc = m.getContext('2d'); mc.font = pad.font; mc.fillStyle = mc.strokeStyle = '#000';
    mc.lineWidth = fs * .09; mc.lineJoin = 'round';
    mc.fillText(word, pad.x0, pad.base); mc.strokeText(word, pad.x0, pad.base);
    pad.mask = mc.getImageData(0, 0, W, H).data;
    // strict sample points per letter (the glyph itself)
    const s = document.createElement('canvas'); s.width = W; s.height = H;
    const sc = s.getContext('2d'); sc.font = pad.font; sc.fillStyle = '#000';
    sc.fillText(word, pad.x0, pad.base);
    const sd = sc.getImageData(0, 0, W, H).data;
    const step = Math.max(3, Math.round(fs / 40));
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
      if (sd[(y * W + x) * 4 + 3] < 128) continue;
      const L2 = pad.letters.find(l => x >= l.x0 && x < l.x1);
      if (L2 && isLetter(L2.ch)) L2.pts.push([x, y]);
    }
    pad.ictx.clearRect(0, 0, W, H);
    drawGuide();
  }

  const SKIP_WORDS = new Set(['name', 'date', 'class', 'word', 'words', 'vocabulary', 'week', 'unit', 'lesson', 'page', 'test', 'spelling', 'english', 'review', 'practice', 'meaning', 'trace', 'write', 'read', 'say', 'look', 'listen', 'circle', 'match', 'color']);
  function parsePasted(text) {
    const items = [], pending = [];   // pending: items still waiting for a Korean meaning, oldest first
    const add = (en, ko) => {
      en = en.replace(/\s+/g, ' ').replace(/([.!?])[\s.!?]*$/, '$1').trim();
      ko = (ko || '').replace(/[\s,]+$/, '').replace(/\s+/g, ' ').trim();
      const n = en ? en.split(' ').length : 0;
      if (!n) { if (ko && pending.length) pending.shift().ko = ko; return; }
      let item;
      if (n >= 3 || (n >= 2 && /[.!?]$/.test(en))) item = { kind: 's', en: en.charAt(0).toUpperCase() + en.slice(1), ko };
      else {
        const w = en.toLowerCase().replace(/[^a-z' \-]/g, '').replace(/^[\s'\-]+|[\s'\-]+$/g, '').replace(/\s+/g, ' ');
        if (w.replace(/[^a-z]/g, '').length < 2 || w.split(' ').some(t => SKIP_WORDS.has(t))) return;
        item = { kind: 'w', en: w, ko };
      }
      items.push(item);
      if (!ko) pending.push(item);
    };
    for (let line of String(text).split(/\r?\n/)) {
      line = line.replace(/^\s*(?:\(?\d{1,2}[.)]|[-•·*▪︎●○◦]|[①-⑳])\s*/, '').trim();
      if (!line) continue;
      // several "word meaning" pairs on one line: "apple 사과  banana 바나나"
      const pairs = [...line.matchAll(/([A-Za-z][A-Za-z' \-]*?)\s*[:=\-–—]?\s*([가-힣][가-힣 ,~·()]*)/g)];
      const latinWords = (line.match(/[A-Za-z]+/g) || []).length;
      if (pairs.length >= 2 && latinWords <= pairs.length * 2) { pairs.forEach(m => add(m[1], m[2])); continue; }
      const en = line.replace(/[^A-Za-z' \-.,!?]/g, ' ').replace(/\s+([.,!?])/g, '$1').replace(/^[\s\-.,!?]+/, '');
      const ko = (line.match(/[가-힣][가-힣 ,~·()]*/g) || []).join(' ');
      add(en, ko);
    }
    const seen = new Set(), words = [], sentences = [];
    for (const x of items) {
      if (x.kind === 's') { if (sentences.length < 2) sentences.push({ en: x.en, ko: x.ko }); continue; }
      if (seen.has(x.en) || words.length >= 20) continue;
      seen.add(x.en);
      words.push({ en: x.en, ko: x.ko, emoji: EMOJI[x.en] || '' });
    }
    return { words, sentences };
  }

  async function shrinkImage(file, max, q) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
      const t = document.createElement('canvas'); const ts = 144 / Math.max(c.width, c.height);
      t.width = Math.round(c.width * ts); t.height = Math.round(c.height * ts);
      t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);

    } finally { URL.revokeObjectURL(url); }
  }

        const rows = document.getElementById('rows');
        const n = rows.querySelectorAll('.wrow').length;
        if (n >= 20) { toast('You can add up to 20 words'); break; }
        rows.insertAdjacentHTML('beforeend', wordRow(n));
        document.getElementById('w-en-' + n).focus();
        break;
      }
      case 'row-del': b.closest('.wrow').querySelectorAll('input').forEach(i => { i.value = ''; delete i.dataset.auto; }); break;
      case 'scan-stop': if (scan.ctl) scan.ctl.abort(); break;
      case 'paste-read': readPasted(); break;
      case 'scan-add': applyScan(false); break;
      case 'scan-replace': applyScan(true); break;
      case 'fill-example': renderParent(normWeek(EXAMPLE)); toast('Example words filled in. Tap Save words to use them.'); break;
      case 'reset-ask':
        document.getElementById('resetBox').innerHTML = `<p class="help">All ${state.progress.stars} stars and word progress go back to 0. This can't be undone.</p>
          <div class="p-actions"><button type="button" class="btn berry sm" data-act="reset-do">Reset to 0</button><button type="button" class="btn ghost sm" data-act="reset-no">Cancel</button></div>`;
        break;
      case 'reset-no': document.getElementById('resetBox').innerHTML = `<button type="button" class="btn ghost sm" data-act="reset-ask">Start stars over</button>`; break;
      case 'reset-do':
        if (activeKid()) { activeKid().stars = 0; activeKid().mastery = {}; } saveProgress(); updatePill();
        document.getElementById('resetBox').innerHTML = `<p class="help">Stars reset to 0.</p>`;
        break;
    }
  });
  document.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (e.target.id === 'authForm') { submitAuth(); return; }
    if (e.target.id === 'newPwForm') { submitNewPassword(); return; }
    if (e.target.id === 'gateForm') {
      const v = Number(document.getElementById('gateIn').value);
      if (v === gateAns) renderParent();
      else document.getElementById('gateErr').hidden = false;
    } else if (e.target.id === 'weekForm') {
      const err = document.getElementById('saveErr');
      const { words, sentences } = collectWeek();
      const bad = words.find(w => !/^[a-z][a-z '\-]*$/.test(w.en));
      if (!words.length) { err.textContent = 'Please enter at least one word.'; err.hidden = false; return; }
      if (bad) { err.textContent = `Please use English letters only in "${bad.en}".`; err.hidden = false; return; }
      if (words.length < 3) { err.textContent = 'Sound Hunt needs at least 3 words.'; err.hidden = false; return; }
      err.hidden = true;
      const res = await saveWeek({ words, sentences, sample: false });
      if (res === 'failed') toast('Saved on this device. It will sync to your account when you are back online.');
      else toast(`Saved ${words.length} words!`);
      renderHome(); window.scrollTo(0, 0);
    }
  });
  document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.kid) renameKid(e.target.dataset.kid, e.target.value); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'kidNew') { e.preventDefault(); addKid(); }
    else if (e.target.dataset && e.target.dataset.kid) { e.preventDefault(); e.target.blur(); }
  });
  document.addEventListener('input', (e) => {
    const m = e.target.id && e.target.id.match(/^w-en-(\d+)$/);
    if (m) {
      const em = document.getElementById('w-em-' + m[1]);
      const hit = EMOJI[e.target.value.trim().toLowerCase()];
      if (em && (!em.value || em.dataset.auto === '1')) { em.value = hit || ''; if (hit) em.dataset.auto = '1'; else delete em.dataset.auto; }
    } else if (e.target.id && e.target.id.startsWith('w-em-')) {
      delete e.target.dataset.auto;
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'camIn' || e.target.id === 'picIn') {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      runScan(f);
    }
  });

  applyTheme();
  (async () => {
    if (CLOUD) {
      app.innerHTML = loadingHTML();
      await initCloud();
      if (sb && !state.user && !state.recovery && !lsGet(LS_GUEST)) { renderAuth('login'); return; }
      if (state.user) { await Promise.race([pullCloud(), new Promise(r => setTimeout(r, 4000))]); }
    }
    routeStart();
  })();
  connectSample();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>

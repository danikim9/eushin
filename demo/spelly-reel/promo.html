<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>Spelly 릴스 — 4가지 세계</title>
<!-- 1080x1920 세로(릴스) 30초 홍보 영상 — Spelly 4가지 테마.
     render(t) 는 시간 t(초)만으로 화면을 그리는 순수 함수 → render.mjs 가 프레임별로 캡처.
     앱 화면은 footage.mjs 가 녹화한 footage/NNNNN.jpg(30fps)와 marks.json(장면 시작 시각)에서 가져옴.
     장면 시간은 audio.py · README 의 보이스오버 타이밍과 같이 옮길 것. -->
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Medium.woff2);font-weight:500}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2);font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2);font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2);font-weight:900}
:root{--night:#14162B;--ink:#24274D;--cream:#FFF1C4;--sun:#FFD75E;--pink:#FF8C94;--mint:#4AC7A8;--mintSoft:#B8F2E6;--blue:#82AAFF;--red:#FF3B4E;--paper:#FFFDF6}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,'Noto Color Emoji';color:var(--ink);letter-spacing:-0.03em;background:var(--night)}
#cam{position:absolute;inset:0}
.layer{position:absolute;inset:0;opacity:0;overflow:hidden}
.c{position:absolute;left:0;right:0;text-align:center;transform-origin:50% 50%;white-space:nowrap}
.blk{font-weight:900;line-height:1.05}
#flash{position:absolute;inset:0;opacity:0;pointer-events:none}
.bar{position:absolute;left:0;right:0;opacity:0}
.hl{background:linear-gradient(transparent 58%,var(--sun) 58%,var(--sun) 92%,transparent 92%)}
.dev{position:absolute;left:40px;width:1000px;height:750px;padding:14px;margin:-14px;border-radius:52px;background:#0E0F1E;box-shadow:0 40px 90px rgba(0,0,0,.4),inset 0 0 0 4px rgba(255,255,255,.1);transform-origin:50% 50%}
.dev .scr{position:relative;width:1000px;height:750px;border-radius:40px;overflow:hidden;background:#272B5E}
.dev img{position:absolute;left:0;top:0;width:1024px;height:768px;transform-origin:0 0}
.chip{display:inline-block;background:var(--ink);color:var(--sun);font-size:50px;font-weight:800;padding:20px 44px;border-radius:999px}
.gm{position:absolute;width:236px;height:92px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:800;color:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.kam{position:absolute;left:70px;font:500 46px/1 'Comic Sans MS',P;color:#8A8FB8;white-space:nowrap;letter-spacing:.06em}
.pill{position:absolute;display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:14px 34px 14px 20px;font-size:88px;font-weight:900;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.pill .ic{font-size:76px;width:90px;text-align:center}
</style></head>
<body>
<div id="stage"><div id="cam">

  <!-- S1 훅: 깜지 -->
  <div class="layer" id="L1" style="background:var(--night)">
    <div id="kams"></div>
    <div class="c blk" id="s1a" style="top:560px;font-size:130px;color:#fff">영어 단어,</div>
    <div class="c blk" id="s1b" style="top:720px;font-size:130px;color:#fff">아직도</div>
    <div class="c blk" id="s1c" style="top:900px;font-size:200px;color:var(--sun)">깜지 쓰게 해?</div>
  </div>

  <!-- S2 지루하면 안 외워 -->
  <div class="layer" id="L2" style="background:#000">
    <svg id="xmark" width="520" height="520" viewBox="-260 -260 520 520" style="position:absolute;left:280px;top:230px">
      <path d="M-170 -170 L170 170 M170 -170 L-170 170" stroke="#FF3B4E" stroke-width="64" stroke-linecap="round"/>
    </svg>
    <div class="c blk" id="s2a" style="top:860px;font-size:130px;color:#fff">애들은</div>
    <div class="c blk" id="s2b" style="top:1020px;font-size:160px;color:#fff">지루하면</div>
    <div class="c blk" id="s2c" style="top:1210px;font-size:220px;color:var(--pink)">안 외워.</div>
  </div>

  <!-- S3 그래서 세계를 고르게 -->
  <div class="layer" id="L3" style="background:var(--cream)">
    <div class="c blk" id="s3a" style="top:210px;font-size:96px">그래서,</div>
    <div class="c blk" id="s3b" style="top:340px;font-size:150px">세계를 <span class="hl">아이가</span></div>
    <div class="c blk" id="s3c" style="top:520px;font-size:150px">고르게 했어.</div>
    <div class="dev" id="d3" style="top:860px"><div class="scr"><img id="f3"></div></div>
  </div>

  <!-- S4 4가지 테마 -->
  <div class="layer" id="L4">
    <div class="c" id="s4n" style="top:200px"><span class="chip" id="s4nT">WORLD 1 / 4</span></div>
    <div class="c blk" id="s4t" style="top:340px;font-size:170px;color:#fff"></div>
    <div class="dev" id="d4" style="top:720px"><div class="scr"><img id="f4"></div></div>
    <div class="pill" id="rw" style="left:700px;top:1390px"><span class="ic" id="rwI"></span><span id="rwT">+1</span></div>
    <div class="c" id="s4s" style="top:1580px;font-size:58px;font-weight:800;color:#fff"></div>
  </div>

  <!-- S5 게임 16개 · 별은 끝이 없어 -->
  <div class="layer" id="L5" style="background:var(--night)">
    <div class="c blk" id="s5a" style="top:190px;font-size:90px;color:#fff">철자 게임만</div>
    <div class="c blk" id="s5n" style="top:300px;font-size:330px;color:var(--sun);font-variant-numeric:tabular-nums"><span id="s5v">0</span><span style="font-size:130px">개</span></div>
    <div id="games"></div>
    <svg id="rain" width="1080" height="1920" style="position:absolute;inset:0"></svg>
    <div class="c blk" id="s5b" style="top:620px;font-size:120px;color:#fff">맞힐 때마다 ⭐</div>
    <div class="c blk" id="s5c" style="top:820px;font-size:380px;color:var(--sun)">∞</div>
    <div class="c blk" id="s5d" style="top:1260px;font-size:150px;color:#fff">끝이 <span style="color:var(--sun)">없어.</span></div>
  </div>

  <!-- S6 바꿔도 그대로 -->
  <div class="layer" id="L6" style="background:var(--night)">
    <div class="c blk" id="s6a" style="top:220px;font-size:140px;color:#fff">테마를 바꿔도</div>
    <div class="dev" id="d6" style="top:560px"><div class="scr"><img id="f6"></div></div>
    <div class="pill" id="cnt" style="left:340px;top:1380px"><span class="ic" id="cntI">⭐</span><span>41</span></div>
    <div class="c blk" id="s6b" style="top:1580px;font-size:130px;color:#fff">모은 별은 <span style="color:var(--sun)">그대로.</span></div>
  </div>

  <!-- S7 -->
  <div class="layer" id="L7" style="background:var(--ink)">
    <div class="c blk" id="s7a" style="top:700px;font-size:120px;color:#fff">외우게 하지 말고,</div>
    <div class="c blk" id="s7b" style="top:900px;font-size:190px;color:var(--sun)">놀게 하세요.</div>
  </div>

  <!-- S8 엔딩 -->
  <div class="layer" id="L8" style="background:var(--cream)">
    <svg id="logo" width="520" height="520" viewBox="200 180 640 680" style="position:absolute;left:280px;top:260px">
      <path d="M790 190 l18 44 44 18 -44 18 -18 44 -18 -44 -44 -18 44 -18z" fill="#FF8C94"/>
      <circle cx="232" cy="268" r="16" fill="#4AC7A8"/>
      <path d="M210 740 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10z" fill="#FFE08A" stroke="#34374F" stroke-width="5" stroke-linejoin="round"/>
      <g transform="rotate(-7 512 540)">
        <rect x="252" y="316" width="520" height="500" rx="128" fill="#4AC7A8" stroke="#34374F" stroke-width="22"/>
        <rect x="252" y="272" width="520" height="480" rx="128" fill="#B8F2E6" stroke="#34374F" stroke-width="22"/>
        <path d="M330 340 Q340 310 380 306" fill="none" stroke="#FFFDF6" stroke-width="22" stroke-linecap="round" opacity=".9"/>
        <g fill="none" stroke="#34374F" stroke-width="22" stroke-linecap="round"><path d="M398 520 Q428 476 458 520"/><path d="M566 520 Q596 476 626 520"/></g>
        <ellipse cx="370" cy="574" rx="40" ry="24" fill="#FF8C94" opacity=".7"/><ellipse cx="654" cy="574" rx="40" ry="24" fill="#FF8C94" opacity=".7"/>
        <path d="M472 570 Q512 572 552 570 Q546 628 512 628 Q478 628 472 570Z" fill="#FF8C94" stroke="#34374F" stroke-width="14" stroke-linejoin="round"/>
        <path d="M686 236 l26 53 58 8 -42 41 10 58 -52 -27 -52 27 10 -58 -42 -41 58 -8z" fill="#FFE08A" stroke="#34374F" stroke-width="16" stroke-linejoin="round" transform="rotate(12 686 300)"/>
      </g>
    </svg>
    <div class="c blk" id="s8a" style="top:820px;font-size:230px">Spelly</div>
    <div class="c" id="s8b" style="top:1080px;font-size:66px;font-weight:800;line-height:1.35">놀면서 외우는<br>영어 철자.</div>
    <div class="c" id="s8c" style="top:1370px"><span style="display:inline-block;background:var(--ink);color:var(--sun);font-size:76px;font-weight:900;padding:30px 64px;border-radius:999px;letter-spacing:-.01em">spelly.kr</span></div>
    <div class="c" id="s8d" style="top:1560px;font-size:42px;font-weight:800;color:#8A6A1A">🚀 우주 · 👑 공주 · 🤖 로봇 · 🦄 유니콘</div>
  </div>

</div>
<div id="bars"></div>
<div id="flash"></div>
</div>

<script>
const DURATION = 30;
// 녹화본의 장면 시작 시각(초). render.mjs 가 marks.json 으로 덮어씀.
const M = window.MARKS || { end: 40.5, pick: 1.85, home_space: 6.05, win_space: 10.23, home_princess: 14.32, win_princess: 17.49, home_robot: 21.45, win_robot: 24.91, home_unicorn: 28.88, win_unicorn: 32.74, switch: 35.91 };
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eb = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const SVG = 'http://www.w3.org/2000/svg';
const mk = (tag, attrs, parent) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
function slam(el, t, t0, from = 1.9, dur = .26, base = '') {
  if (t < t0) { el.style.opacity = 0; return 0; }
  const k = p(t, t0, t0 + dur);
  el.style.opacity = cl(k * 4);
  el.style.transform = `${base} scale(${1 + (from - 1) * (1 - eo(k))})`;
  return k;
}
function pop(el, t, t0, dur = .35, base = '') {
  if (t < t0) { el.style.opacity = 0; el.style.transform = base + ' scale(0)'; return 0; }
  const k = p(t, t0, t0 + dur);
  el.style.opacity = cl(k * 3);
  el.style.transform = `${base} scale(${eb(k)})`;
  return k;
}
function rise(el, t, t0, t1 = 99, dist = 70) {
  const a = p(t, t0, t0 + .35), b = p(t, t1, t1 + .25);
  el.style.opacity = a * (1 - b);
  el.style.transform = `translateY(${dist * (1 - eo(a)) - dist * eo(b)}px)`;
}
// 녹화본 프레임 하나를 img 에 띄움(디코드까지 기다림). zoom: [배율, 중심x, 중심y] (앱 좌표 1024x768)
const pending = [];
function shot(img, sec, zoom) {
  const n = Math.max(1, Math.round(sec * 30) + 1), src = `footage/${String(n).padStart(5, '0')}.jpg`;
  if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; pending.push(img.decode().catch(() => {})); }
  const [z, cx, cy] = zoom || [1, 512, 384];
  const s = 1000 / 1024 * z;
  const tx = cl(500 - cx * s, 1000 - 1024 * s, 0), ty = cl(375 - cy * s, 750 - 768 * s, 0);
  img.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
}
function devIn(el, t, t0, base = '') {   // 기기가 아래에서 튀어 오름
  const k = p(t, t0, t0 + .45);
  el.style.opacity = cl(k * 3);
  el.style.transform = `translateY(${(1 - eo(k)) * 500}px) rotate(${(1 - eo(k)) * 8}deg) scale(${.85 + .15 * eb(k)}) ${base}`;
}

// 장면 시간 — audio.py·README 의 보이스오버 타이밍과 같이 옮길 것
const layerWin = { L1: [0, 2.8], L2: [2.8, 5.2], L3: [5.2, 7.4], L4: [7.4, 15.4], L5: [15.4, 19.8], L6: [19.8, 23.6], L7: [23.6, 26.2], L8: [26.2, 99] };
const THEMES = [
  { id: 'space', name: '🚀 우주 탐험', bg: 'radial-gradient(90% 60% at 85% 0%, #3E3283 0%, transparent 70%), linear-gradient(180deg, #272B5E 0%, #1E2150 100%)', ink: '#fff', rw: '⭐', sub: '코코랑 행성 여행 · 별 모으기', fl: '#FFD75E' },
  { id: 'princess', name: '👑 공주 왕국', bg: 'linear-gradient(180deg, #FFD6E4 0%, #F6B3CB 100%)', ink: '#5B2147', rw: '💎', sub: '로지랑 성 여행 · 보석 모으기', fl: '#FF8CB4' },
  { id: 'robot', name: '🤖 로봇 시티', bg: 'linear-gradient(180deg, #2D63D8 0%, #1B3F9C 100%)', ink: '#fff', rw: '⚡', sub: '볼트랑 도시 밝히기 · 에너지', fl: '#5EE0FF' },
  { id: 'unicorn', name: '🦄 유니콘 원더랜드', bg: 'linear-gradient(180deg, #E3E6FF 0%, #FFE1F1 60%, #FFF4D6 100%)', ink: '#3A2C6E', rw: '🔮', sub: '루나랑 무지개 너머 · 크리스털', fl: '#C9A6FF' },
];
const T4 = 7.4, TD = 2.0;   // 테마 하나당 2초
const FLASHES = [[1.25, .16, '#FFD75E'], [2.8, .1, '#fff'], [4.3, .2, '#FF8C94'], [5.2, .3, '#fff'], ...THEMES.map((th, i) => [T4 + i * TD, .22, th.fl]), [15.4, .3, '#fff'], [17.6, .25, '#FFD75E'], [19.8, .25, '#fff'], [21.6, .2, '#FFD75E'], [23.6, .2, '#fff'], [26.2, .35, '#fff']];
const SHAKES = [[0.15, .2, 14], [0.6, .2, 16], [1.25, .35, 38], [3.0, .2, 16], [3.6, .2, 18], [4.3, .4, 40], [5.3, .2, 14], ...THEMES.map((_, i) => [T4 + i * TD, .3, 28]), ...THEMES.map((_, i) => [T4 + i * TD + 1.25, .25, 16]), [16.9, .35, 30], [17.6, .2, 16], [18.4, .35, 34], [21.6, .3, 26], [24.5, .35, 34], [26.2, .3, 18]];
const GLITCH = [[2.45, 2.8], [15.05, 15.4], [23.25, 23.6]];

// ---------- S1 깜지 줄
const KW = ['apple', 'banana', 'because', 'rocket', 'friend', 'school', 'yellow', 'tomato'];
const kams = Array.from({ length: 30 }, (_, i) => {
  const d = document.createElement('div'); d.className = 'kam';
  d.style.top = (60 + i * 62) + 'px';
  d.textContent = Array(12).fill(KW[i % KW.length]).join(' ');
  $('kams').appendChild(d); return d;
});
// ---------- S5 게임 16개 (앱의 실제 게임 이름)
const GAMES = ['Word Cards', 'Letter Rocket', 'Missing Star', 'Vowel Hunt', 'Chunk Builder', 'Peek & Spell', 'Spelling Bee', 'Meteor Spell', 'Trace & Write', 'Sound Hunt', 'Memory Match', 'Star Catch', 'Sentence Maker', 'Sentence Writer', 'Sentence Trace', 'Sentence Ship'];
const GC = ['#DDE7FF', '#FFF1C4', '#E6DDFF', '#B8F2E6', '#FFD3D6'];
const gEls = GAMES.map((g, i) => {
  const d = document.createElement('div'); d.className = 'gm'; d.textContent = g;
  d.style.background = GC[(i + Math.floor(i / 4)) % GC.length];
  d.style.left = (38 + (i % 4) * 256) + 'px'; d.style.top = (760 + Math.floor(i / 4) * 116) + 'px';
  if (g.length > 12) d.style.fontSize = '27px';
  $('games').appendChild(d); return d;
});
const RAIN = Array.from({ length: 46 }, (_, i) => ({ el: mk('path', { d: 'M12 2.6l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.4l-5.4 2.9 1.1-6.1L3.2 9l6.1-.8z', fill: ['#FFD75E', '#FFE9A8', '#fff'][i % 3], stroke: '#C9971F', 'stroke-width': 1 }, $('rain')), x: hash(i) * 1080, s: 2 + hash(i + 5) * 4, v: 700 + hash(i + 9) * 900, d: hash(i + 13) * .9, r: (hash(i + 2) - .5) * 400 }));

const BARS = Array.from({ length: 10 }, () => { const b = document.createElement('div'); b.className = 'bar'; $('bars').appendChild(b); return b; });

function render(t) {
  pending.length = 0;
  const fr = Math.floor(t * 30);
  for (const k in layerWin) { const [a, b] = layerWin[k]; $(k).style.opacity = t >= a && t < b ? 1 : 0; }
  let sx = 0, sy = 0;
  for (const [t0, d, amp] of SHAKES) { if (t >= t0 && t < t0 + d) { const k = 1 - p(t, t0, t0 + d); sx += (hash(fr) - .5) * 2 * amp * k; sy += (hash(fr + 99) - .5) * 2 * amp * k; } }
  let g = 0; for (const [a, b] of GLITCH) if (t >= a && t < b) g = 1;
  if (g) sx += (hash(fr * 3) - .5) * 40;
  $('cam').style.transform = `translate(${sx}px,${sy}px)`;
  $('cam').style.filter = g && hash(fr * 7) > .5 ? `hue-rotate(${hash(fr) * 180}deg) saturate(2)` : 'none';
  BARS.forEach((b, i) => {
    if (!g) { b.style.opacity = 0; return; }
    b.style.opacity = hash(fr * 13 + i) > .45 ? .85 : 0;
    b.style.top = (hash(fr * 5 + i * 31) * 1920) + 'px';
    b.style.height = (6 + hash(fr + i * 7) * 70) + 'px';
    b.style.background = ['#FF2D55', '#00E5FF', '#fff', '#000'][i % 4];
    b.style.transform = `translateX(${(hash(fr + i) - .5) * 300}px)`;
  });
  const rgb = g ? `${8 + hash(fr) * 14}px 0 #FF2D55, ${-8 - hash(fr + 1) * 14}px 0 #00E5FF` : 'none';
  let fo = 0, fc = '#fff';
  for (const [t0, d, c] of FLASHES) { if (t >= t0 && t < t0 + d) { const k = 1 - p(t, t0, t0 + d); if (k > fo) { fo = k; fc = c; } } }
  $('flash').style.opacity = fo * .9; $('flash').style.background = fc;

  // S1 — 깜지 줄이 빠르게 차오름
  if (t < 2.8) {
    kams.forEach((d, i) => { const k = p(t, i * .07, i * .07 + .5); d.style.opacity = .1 + .16 * k; d.style.clipPath = `inset(0 ${100 - 100 * k}% 0 0)`; });
    slam($('s1a'), t, 0.15, 1.6); slam($('s1b'), t, 0.6, 1.5); slam($('s1c'), t, 1.25, 2.6, .3);
    ['s1a', 's1b', 's1c'].forEach(id => $(id).style.textShadow = rgb || '0 8px 30px rgba(0,0,0,.6)');
  }
  // S2 — 빨간 X
  if (t >= 2.8 && t < 5.2) {
    pop($('xmark'), t, 2.9, .3, `rotate(${-20 + 20 * eo(p(t, 2.9, 3.2))}deg)`);
    slam($('s2a'), t, 3.0, 1.5); slam($('s2b'), t, 3.6, 1.6); slam($('s2c'), t, 4.3, 2.4, .3);
  }
  // S3 — 테마 고르기 화면, 카드 누를 때마다 앱 전체가 바뀜(1.6배속)
  if (t >= 5.2 && t < 7.4) {
    slam($('s3a'), t, 5.3, 1.5); slam($('s3b'), t, 5.65, 1.6); slam($('s3c'), t, 6.0, 1.6);
    devIn($('d3'), t, 5.35);
    shot($('f3'), M.pick - .2 + (t - 5.35) * 1.6);
  }
  // S4 — 테마 4개, 2초씩: 홈 0.8초 → 게임 정답 순간 1.2초
  if (t >= 7.4 && t < 15.4) {
    const i = Math.min(3, Math.floor((t - T4) / TD)), th = THEMES[i], ts = T4 + i * TD, lt = t - ts;
    $('L4').style.background = th.bg;
    $('s4nT').textContent = `WORLD ${i + 1} / 4`;
    $('s4t').textContent = th.name; $('s4t').style.color = th.ink; $('s4t').style.fontSize = th.name.length > 7 ? '112px' : '170px';
    slam($('s4t'), t, ts + .02, 1.9, .25);
    pop($('s4n'), t, ts + .05, .3);
    $('d4').style.opacity = 1;
    const kick = lt < .25 ? 1 + .12 * (1 - eo(p(lt, 0, .25))) : (lt >= .8 && lt < 1.0 ? 1 + .05 * (1 - eo(p(lt, .8, 1.0))) : 1);
    $('d4').style.transform = `scale(${kick})`;
    if (lt < .8) shot($('f4'), M['home_' + th.id] + .25 + lt * 1.2, [1.0 + .12 * lt, 520, 300]);
    else shot($('f4'), M['win_' + th.id] - .45 + (lt - .8), [1.18, 640, 420]);
    $('rwI').textContent = th.rw;
    const wk = pop($('rw'), t, ts + 1.25, .35, 'rotate(-6deg)');
    $('rw').style.opacity = lt >= 1.25 ? 1 : 0;
    $('s4s').textContent = th.sub; $('s4s').style.color = th.ink;
    rise($('s4s'), t, ts + .3, ts + 1.2, 40);
  }
  // S5 — 게임 16개 → 맞힐 때마다 별, 끝이 없어
  if (t >= 15.4 && t < 19.8) {
    const a = t < 17.6;
    ['s5a', 's5n', 'games'].forEach(id => $(id).style.visibility = a ? 'visible' : 'hidden');
    ['s5b', 's5c', 's5d', 'rain'].forEach(id => $(id).style.visibility = a ? 'hidden' : 'visible');
    if (a) {
      slam($('s5a'), t, 15.45, 1.5);
      $('s5v').textContent = Math.round(16 * eio(p(t, 15.6, 16.9)));
      $('s5n').style.opacity = t >= 15.6 ? 1 : 0;
      $('s5n').style.transform = `scale(${t < 15.8 ? 1.6 - 3 * p(t, 15.6, 15.8) : 1 + .25 * Math.sin(p(t, 16.9, 17.2) * Math.PI)})`;
      gEls.forEach((d, i) => pop(d, t, 15.6 + i * .08, .3, `rotate(${(hash(i) - .5) * 8}deg)`));
    } else {
      slam($('s5b'), t, 17.65, 1.6);
      slam($('s5c'), t, 18.4, 2.2, .3);
      $('s5c').style.transform += ` rotate(${(t - 18.4) * 12}deg)`;
      slam($('s5d'), t, 18.75, 1.6);
      RAIN.forEach((r, i) => { const k = t - 17.6 - r.d; r.el.setAttribute('opacity', k > 0 ? 1 : 0); r.el.setAttribute('transform', `translate(${r.x} ${-80 + r.v * Math.max(0, k)}) rotate(${r.r * k}) scale(${r.s})`); });
    }
  }
  // S6 — 테마를 바꿔도 숫자 그대로
  if (t >= 19.8 && t < 23.6) {
    slam($('s6a'), t, 19.85, 1.6);
    devIn($('d6'), t, 19.95);
    const ft = M.switch - .1 + (t - 19.95) * 1.25;
    shot($('f6'), ft, [1.0 + .35 * eio(p(t, 20.4, 21.2)), 640, 560]);
    // 녹화 속 카드 탭(실제 약 0.92초 간격, switch~end 에 5번)에 맞춰 아이콘만 바뀜
    const gap = ((M.end || M.switch + 4.59) - M.switch) / 5;
    const step = Math.min(4, Math.max(0, Math.floor((ft - M.switch - .1) / gap)));
    $('cntI').textContent = ['⭐', '💎', '⚡', '🔮', '⭐'][step];
    const ck = pop($('cnt'), t, 20.9, .35);
    const sw = (ft - M.switch - .1 + gap) % gap;
    if (t > 21.3) $('cnt').style.transform = `scale(${1 + .12 * Math.max(0, 1 - sw / .2)})`;
    slam($('s6b'), t, 21.6, 1.7);
  }
  // S7
  if (t >= 23.6 && t < 26.2) {
    slam($('s7a'), t, 23.7, 1.5); slam($('s7b'), t, 24.5, 2.0, .3);
    $('L7').style.transform = `scale(${1 + eio(p(t, 25.8, 26.2)) * 1.5})`;
  }
  // S8 엔딩
  if (t >= 26.2) {
    const k = p(t, 26.25, 26.75);
    $('logo').style.opacity = cl(k * 3);
    $('logo').style.transform = `translateY(${(1 - eo(k)) * -600 + Math.sin(Math.max(0, t - 26.75) * 4) * 10}px) rotate(${(1 - eb(k)) * 30}deg) scale(${.6 + .4 * eb(k)})`;
    slam($('s8a'), t, 26.7, 1.6, .3);
    rise($('s8b'), t, 27.1); rise($('s8c'), t, 27.5); rise($('s8d'), t, 27.9);
  }
  return Promise.all(pending);
}
window.render = render;
window.DURATION = DURATION;
if (!navigator.webdriver) {
  const q = new URLSearchParams(location.search).get('t');
  document.fonts.ready.then(() => {
    if (q !== null) return render(+q);
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
